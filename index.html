<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0e16">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Thai Speak</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Thai Speak">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
/* offline install: once per version, save every sound pack so the whole course works with no internet */
window.addEventListener('load', function () {
  if (!('serviceWorker' in navigator) || location.protocol !== 'https:') return;
  navigator.serviceWorker.register('sw.js').catch(function () {});
  var KEY = 'ts-offline-' + (window.__BUILD || '');
  try { if (localStorage.getItem(KEY)) return; } catch (e) { return; }
  if (!navigator.onLine) return;
  var urls = Object.keys(window.DATA.packs).map(function (n) { return 'audio/' + window.DATA.packs[n]; });
  var chip = document.createElement('div');
  chip.style.cssText = 'position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:95;background:#0d1526;color:#e8eef8;border:1px solid #27354d;border-radius:12px;padding:10px 14px;font:14px system-ui,-apple-system,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.5)';
  chip.textContent = 'Saving lessons for offline… 0 / ' + urls.length;
  document.body.appendChild(chip);
  navigator.serviceWorker.ready.then(function (reg) {
    navigator.serviceWorker.addEventListener('message', function (ev) {
      var d = ev.data || {};
      if (d.type === 'cacheAll-progress') chip.textContent = 'Saving lessons for offline… ' + d.done + ' / ' + d.total;
      if (d.type === 'cacheAll-done') {
        if (!d.failed) { try { localStorage.setItem(KEY, '1'); } catch (e) {} chip.textContent = 'Saved — the whole course now works offline.'; }
        else chip.textContent = d.failed + ' lessons could not be saved — open again on Wi-Fi.';
        setTimeout(function () { chip.remove(); }, 4000);
      }
    });
    reg.active.postMessage({ type: 'cacheAll', urls: urls });
  });
});
</script>

<style>:root{
  --bg:#0a0e16; --bg2:#0f1520; --card:#131b29; --card2:#18233470; --line:#233149; --line2:#2d3e5c;
  --tx:#e9eef7; --tx2:#a9b6ca; --tx3:#71809a;
  --ac:#3fd6c6; --ac2:#1fa99b; --acbg:#3fd6c61a;
  --gold:#f2b84b; --red:#ff6b6b; --redbg:#ff6b6b1c; --grn:#5ee08f; --grnbg:#5ee08f1c;
  --mid:#9fb0c8; --low:#6aa8ff; --fall:#ff8f6b; --high:#c58bff; --rise:#5ee08f;
  --r:18px; --th:"Sukhumvit Set","Thonburi","Leelawadee UI","Noto Sans Thai","Tahoma",sans-serif;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Sukhumvit Set","Thonburi","Leelawadee UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:17px/1.5 var(--ui);-webkit-text-size-adjust:100%}
body{overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
svg{display:block}
.th{font-family:var(--th)}
#app{max-width:860px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 10px) 18px calc(env(safe-area-inset-bottom) + 30px)}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:6px 0 12px}
.top h1{font-size:20px;margin:0;flex:1;letter-spacing:.2px}
.top h1 small{display:block;font-size:13px;color:var(--tx3);font-weight:500}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:15px}
.pill svg{width:18px;height:18px}
.ibtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.ibtn svg{width:22px;height:22px}
.back{display:flex;align-items:center;gap:6px;color:var(--tx2);font-weight:600;padding:8px 4px}
.back svg{width:20px;height:20px}

/* hero */
.hero{position:relative;border-radius:24px;overflow:hidden;background:radial-gradient(120% 140% at 50% 0%,#14233a 0%,#0b111c 60%);border:1px solid var(--line);margin-bottom:16px}
.hero canvas{width:100%;height:190px;display:block}
.hero .cap{position:absolute;left:18px;bottom:14px;right:18px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none}
.hero .cap b{font-size:15px;color:var(--tx2);font-weight:600}
.ring{display:flex;align-items:center;gap:10px;pointer-events:auto}
.ring svg{width:52px;height:52px}
.ring span{font-size:13px;color:var(--tx2);line-height:1.25;text-align:right}

.about{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;font-size:15.5px;color:var(--tx2)}
.about b{color:var(--tx)}
.about ol{margin:6px 0 0;padding-left:20px}
.about li{margin:3px 0}
.about .x{float:right;color:var(--tx3);font-size:14px;padding:2px 6px}

.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:17px 18px;border-radius:16px;font-weight:800;font-size:18px;background:var(--ac);color:#04121a;box-shadow:0 4px 0 var(--ac2)}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ac2)}
.big[disabled]{background:#26344c;color:#6d7d97;box-shadow:0 4px 0 #1b2638}
.big.ghost{background:var(--card);color:var(--tx);box-shadow:0 4px 0 #0a1019;border:1px solid var(--line2)}
.big.red{background:var(--red);box-shadow:0 4px 0 #b84343;color:#1a0505}
.big svg{width:22px;height:22px}
.row{display:flex;gap:10px}
.row>*{flex:1}

.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin:18px 0 14px}
.tabs button{flex:1;padding:11px 8px;border-radius:11px;font-weight:700;color:var(--tx2);font-size:15.5px}
.tabs button.on{background:var(--acbg);color:var(--ac);box-shadow:inset 0 0 0 1px #3fd6c650}

/* unit path */
.unit{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;width:100%;text-align:left}
.unit .ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:#1b2840;flex:none}
.unit .ic svg{width:28px;height:28px;color:var(--ac)}
.unit.done .ic{background:#163a36}
.unit .t{flex:1;min-width:0}
.unit .t b{display:block;font-size:17px}
.unit .t .th{color:var(--tx2);font-size:16px}
.unit .t small{display:block;color:var(--tx3);font-size:13.5px;margin-top:2px}
.steps{display:flex;gap:5px;margin-top:7px}
.steps i{height:6px;flex:1;max-width:46px;border-radius:9px;background:#26344c}
.steps i.on{background:var(--ac)}
.unit .go{color:var(--tx3)}
.unit .go svg{width:20px;height:20px}
.sec{font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:var(--tx3);font-weight:700;margin:20px 4px 10px}

/* unit menu */
.uhead{text-align:center;padding:4px 0 14px}
.uhead .th{font-size:42px;line-height:1.3}
.uhead h2{margin:2px 0;font-size:22px}
.uhead p{margin:4px 0 0;color:var(--tx2)}
.mode{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:10px}
.mode .n{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#1b2840;color:var(--ac);flex:none}
.mode.ok .n{background:var(--ac);color:#04121a}
.mode b{display:block;font-size:17px}
.mode small{color:var(--tx3);font-size:14px}
.mode .n svg{width:22px;height:22px}

/* lesson */
.bar{display:flex;align-items:center;gap:12px;margin:2px 0 18px}
.bar .prog{flex:1;height:12px;border-radius:9px;background:#1d283b;overflow:hidden}
.bar .prog i{display:block;height:100%;width:100%;background:var(--ac);border-radius:9px;transform-origin:left;transition:transform .35s}
.bar .x{width:40px;height:40px;display:grid;place-items:center;color:var(--tx3)}
.bar .x svg{width:24px;height:24px}
.q{font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--tx3);margin:0 0 10px}
.prompt{font-size:22px;font-weight:700;margin:0 0 16px}

.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 20px;text-align:center;margin-bottom:16px}
.card .thbig{font-family:var(--th);font-size:40px;line-height:1.35;word-break:break-word}
.card .ro{font-size:21px;color:var(--ac);margin-top:4px;font-weight:600}
.card .en{font-size:19px;color:var(--tx2);margin-top:6px}
.card .note{font-size:15px;color:var(--tx2);background:#0f1726;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:14px;text-align:left}
.card .note b{color:var(--gold)}

.play{display:flex;justify-content:center;gap:12px;margin:6px 0 14px;flex-wrap:wrap}
.pbtn{width:84px;height:84px;border-radius:50%;background:var(--ac);color:#04121a;display:grid;place-items:center;box-shadow:0 5px 0 var(--ac2)}
.pbtn svg{width:38px;height:38px}
.pbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ac2)}
.pbtn.sm{width:60px;height:60px;background:var(--card);color:var(--tx);box-shadow:0 4px 0 #070b12;border:1px solid var(--line2)}
.pbtn.sm svg{width:26px;height:26px}
.pbtn.playing{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px #3fd6c622,0 5px 0 var(--ac2)}}
.plab{display:flex;justify-content:center;gap:12px;margin:-6px 0 12px;font-size:12.5px;color:var(--tx3)}
.plab span{width:84px;text-align:center;white-space:nowrap}.plab span.s{width:60px}

/* options */
.opts{display:grid;gap:10px;margin-bottom:16px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 16px;border-radius:16px;background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 #070b12;font-size:18px;min-height:60px}
.opt .k{width:28px;height:28px;border-radius:8px;border:1px solid var(--line2);display:grid;place-items:center;font-size:13px;color:var(--tx3);flex:none}
.opt .th{font-size:22px}
.opt small{display:block;color:var(--ac);font-size:15px}
.opt.sel{border-color:var(--ac);background:#11262a}
.opt.good{border-color:var(--grn);background:var(--grnbg)}
.opt.bad{border-color:var(--red);background:var(--redbg)}
.opt .mini{margin-left:auto;width:44px;height:44px;border-radius:50%;background:#1d2a40;display:grid;place-items:center;flex:none}
.opt .mini svg{width:20px;height:20px;color:var(--ac)}
.opts.two{grid-template-columns:1fr 1fr}
.opts.tones{grid-template-columns:repeat(5,1fr)}
.opts.tones .opt{flex-direction:column;justify-content:center;padding:10px 4px;font-size:14px;text-align:center;gap:4px}
.opts.tones .opt svg{width:46px;height:30px}

/* word tiles */
.slot{min-height:64px;border-bottom:2px solid var(--line2);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;margin-bottom:16px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px}
.tile{padding:10px 14px;border-radius:12px;background:var(--card);border:2px solid var(--line2);box-shadow:0 3px 0 #070b12;font-size:18px;font-weight:600}
.tile.used{visibility:hidden}

/* mic */
.mic{display:flex;flex-direction:column;align-items:center;gap:10px;margin:10px 0 16px}
.micbtn{width:104px;height:104px;border-radius:50%;background:linear-gradient(#ff8a7a,#ff5d6c);color:#fff;display:grid;place-items:center;box-shadow:0 6px 0 #a83442}
.micbtn svg{width:44px;height:44px}
.micbtn.on{animation:mpulse 1s infinite}
@keyframes mpulse{50%{box-shadow:0 0 0 16px #ff5d6c2a,0 6px 0 #a83442}}
.mic small{color:var(--tx3);font-size:14.5px;text-align:center;max-width:420px}
.heard{background:#0f1726;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 14px;font-size:16px;color:var(--tx2)}
.heard .th{font-size:22px;color:var(--tx)}

/* feedback sheet */
.fb{position:fixed;left:0;right:0;bottom:0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);border-top:1px solid var(--line);z-index:50;animation:up .22s ease-out}
.fb .in{max-width:824px;margin:0 auto}
.fb.good{background:#0f2a1f}
.fb.bad{background:#2c1418}
.fb.mid{background:#2a2412}
.fb h3{margin:0 0 4px;font-size:21px;display:flex;align-items:center;gap:8px}
.fb.good h3{color:var(--grn)} .fb.bad h3{color:var(--red)} .fb.mid h3{color:var(--gold)}
.fb h3 svg{width:26px;height:26px}
.fb p{margin:0 0 12px;color:var(--tx2);font-size:16px}
.fb p .th{font-size:20px;color:var(--tx)}
@keyframes up{from{transform:translateY(100%)}}
.spacer{height:190px}

/* dialogue */
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.msg{max-width:84%;padding:11px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:left}
.msg.me{align-self:flex-end;background:#12302d;border-color:#245a52}
.msg .th{font-size:21px;line-height:1.4}
.msg .ro{color:var(--ac);font-size:15px}
.msg .en{color:var(--tx3);font-size:14.5px}
.msg.now{outline:2px solid var(--ac);outline-offset:2px}
.msg.hide .th,.msg.hide .ro{filter:blur(7px);opacity:.6}
.msg .who{font-size:12px;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}

/* tones */
.tone{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:9px}
.tone .th{font-size:30px;min-width:70px}
.tone .ro{color:var(--ac);font-weight:600}
.tone small{color:var(--tx3);display:block}
.tone svg.c{width:58px;height:38px;margin-left:auto;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.legend span{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--tx2);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 9px}
.legend svg{width:34px;height:22px}

/* letters */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:9px;margin-bottom:14px}
.lt{aspect-ratio:1;border-radius:16px;background:var(--card);border:1px solid var(--line);font-family:var(--th);font-size:38px;display:grid;place-items:center;position:relative}
.lt i{position:absolute;bottom:5px;left:0;right:0;font:600 11px var(--ui);font-style:normal;color:var(--tx3)}
.cls{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700}
.cls.mid{background:#3fd6c622;color:var(--ac)} .cls.high{background:#f2b84b22;color:var(--gold)} .cls.low{background:#6aa8ff22;color:var(--low)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;text-align:left}
.facts div{background:#0f1726;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;color:var(--tx3)}
.facts b{display:block;color:var(--tx);font-size:17px}
.pad{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:0 auto 12px;border-radius:20px;background:#0d1420;border:1px dashed var(--line2);touch-action:none}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:20px}
.padtip{font-size:14px;color:var(--tx3);text-align:center;margin:-4px 0 12px}

/* settings */
.set{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:4px 16px;margin-bottom:14px}
.set .it{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:13px 0;border-bottom:1px solid var(--line)}
.set .it:last-child{border:0}
.set .it span{flex:1 1 220px}
.set .it small{display:block;color:var(--tx3);font-size:13.5px}
.seg{display:flex;background:#0d1420;border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{padding:7px 12px;border-radius:8px;font-size:14.5px;font-weight:700;color:var(--tx3)}
.seg button.on{background:var(--acbg);color:var(--ac)}

.center{text-align:center}
.muted{color:var(--tx3)}
.done-art{font-size:64px;text-align:center;margin:20px 0 6px;font-family:var(--th);color:var(--ac)}
.stars{display:flex;justify-content:center;gap:8px;margin:6px 0 14px}
.stars svg{width:42px;height:42px;color:#2b3a55}
.stars svg.on{color:var(--gold)}
.stat{display:flex;gap:10px;margin:14px 0}
.stat div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px}
.stat small{color:var(--tx3)}
.warn{background:#2a2412;border:1px solid #5a4a1c;color:#f1d79a;border-radius:14px;padding:11px 14px;font-size:14.5px;margin-bottom:14px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);background:#13202f;border:1px solid var(--line2);padding:10px 16px;border-radius:12px;z-index:90;font-size:15px;max-width:90vw}
@media (min-width:700px){ .card .thbig{font-size:50px} .opts.grid2{grid-template-columns:1fr 1fr} }
/* levels */
.lvl{margin-bottom:10px}
.lvh{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:linear-gradient(180deg,#152238,#111a2a);border:1px solid var(--line2);border-radius:var(--r);padding:14px}
.lvh .lvn{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--acbg);color:var(--ac);font-weight:800;font-size:24px;flex:none}
.lvh .t{flex:1;min-width:0}.lvh .t b{display:block;font-size:17.5px}.lvh .t .th{color:var(--tx2)}.lvh .t small{display:block;color:var(--tx3);font-size:13.5px;margin-top:2px}
.lvh .go svg{width:20px;height:20px;color:var(--tx3);transition:transform .2s}
.lvl.open .lvh .go svg{transform:rotate(90deg)}
.lbar{height:6px;border-radius:9px;background:#26344c;margin-top:8px;overflow:hidden;max-width:260px}
.lbar i{display:block;height:100%;width:100%;background:var(--ac);transform-origin:left}
.lvb{padding:10px 0 4px 14px;border-left:2px solid var(--line);margin-left:26px}
.lvb .big{margin:4px 0 8px}
/* levels */
.lvl{margin-bottom:10px}
.lvh{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:linear-gradient(180deg,#152238,#111a2a);border:1px solid var(--line2);border-radius:var(--r);padding:14px}
.lvh .lvn{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--acbg);color:var(--ac);font-weight:800;font-size:24px;flex:none}
.lvh .t{flex:1;min-width:0}.lvh .t b{display:block;font-size:17.5px}.lvh .t .th{color:var(--tx2)}.lvh .t small{display:block;color:var(--tx3);font-size:13.5px;margin-top:2px}
.lvh .go svg{width:20px;height:20px;color:var(--tx3);transition:transform .2s}
.lvl.open .lvh .go svg{transform:rotate(90deg)}
.lbar{height:6px;border-radius:9px;background:#26344c;margin-top:8px;overflow:hidden;max-width:260px}
.lbar i{display:block;height:100%;width:100%;background:var(--ac);transform-origin:left}
.lvb{padding:10px 0 4px 14px;border-left:2px solid var(--line);margin-left:26px}
.lvb .big{margin:4px 0 8px}

.tabs button{padding:11px 4px;font-size:14.5px}
@media (max-width:420px){.tabs button{font-size:12.5px;padding:10px 2px}}

<script>window.__BUILD="2026-11-17 10:29";window.DATA={"levels": [{"n": 1, "title": "Basics", "th": "พื้นฐาน", "desc": "Greetings, numbers, food, getting around — survival Thai."}, {"n": 2, "title": "Daily life", "th": "ชีวิตประจำวัน", "desc": "Bank, phone, renting, errands, weather, transport, eating out, free time."}, {"n": 3, "title": "Building sentences", "th": "สร้างประโยค", "desc": "Past, future, want/must, can, comparing, because/if, opinions, little words, counting."}, {"n": 4, "title": "Teacher at work", "th": "ครูที่โรงเรียน", "desc": "Staff room, parents, running a class, exams, school events, leave and paperwork."}, {"n": 5, "title": "Real-life Thai", "th": "ภาษาไทยจริงๆ", "desc": "Casual speech, very Thai expressions, feelings, emergencies, travel, culture."}], "stories": [{"id": "s1", "title": "Sam's morning", "th": "เช้าของแซม", "level": 2, "lines": [{"th": "ทุกวันแซมตื่นนอนตอนหกโมงเช้า", "ro": "thúk wan Saem dtùuen-nawn dtawn hòk moong cháao", "en": "Every day Sam wakes up at 6 a.m.", "a": "cddc625ed7"}, {"th": "เขาอาบน้ำ แล้วกินข้าวเช้าที่ร้านใกล้บ้าน", "ro": "kháo àap-náam, láew gin khâao cháao thîi ráan glâi bâan", "en": "He showers, then eats breakfast at a shop near home.", "a": "9ffbc0f587"}, {"th": "เขาชอบกินโจ๊กกับกาแฟเย็น", "ro": "kháo chôop gin jóok gàp gaa-fae yen", "en": "He likes rice porridge and iced coffee.", "a": "1c0f317ce5"}, {"th": "เจ็ดโมงครึ่งเขานั่งวินมอไซค์ไปโรงเรียน", "ro": "jèt moong khrûeng kháo nâng win maw-sai bpai roong-rian", "en": "At 7:30 he takes a motorbike taxi to school.", "a": "1bd71978f9"}, {"th": "แปดโมงนักเรียนเข้าแถวเคารพธงชาติ", "ro": "bpàet moong nák-rian khâo thǎeo khao-róp thong-châat", "en": "At 8, the students line up to salute the flag.", "a": "2d75d607a5"}, {"th": "วันนี้แซมสอนสี่คาบ เขาเหนื่อยแต่มีความสุข", "ro": "wan-níi Saem sǎwn sìi khâap, kháo nùeai dtàe mii khwaam-sùk", "en": "Today Sam teaches four periods. He is tired but happy.", "a": "1c887b06b7"}], "q": [{"q": "What time does Sam wake up?", "o": ["5 a.m.", "6 a.m.", "7 a.m.", "8 a.m."], "a": 1}, {"q": "What does he drink?", "o": ["Hot tea", "Iced coffee", "Water", "Milk"], "a": 1}, {"q": "How does he get to school?", "o": ["BTS", "Bus", "Motorbike taxi", "He walks"], "a": 2}, {"q": "How many periods does he teach today?", "o": ["Two", "Three", "Four", "Five"], "a": 2}]}, {"id": "s2", "title": "At the market", "th": "ที่ตลาด", "level": 2, "lines": [{"th": "วันเสาร์ แม่พาลูกไปตลาด", "ro": "wan sǎo, mâe phaa lûuk bpai dtà-làat", "en": "On Saturday, a mother takes her child to the market.", "a": "ababa855b6"}, {"th": "แม่ซื้อผัก ปลา และผลไม้", "ro": "mâe súue phàk, bplaa láe phǒn-lá-mái", "en": "She buys vegetables, fish and fruit.", "a": "937cb90fe0"}, {"th": "มะม่วงกิโลละหกสิบบาท แม่บอกว่าแพงไป", "ro": "má-mûang gì-loo lá hòk-sìp bàat, mâe bàwk wâa phaeng bpai", "en": "Mangoes are 60 baht a kilo. She says that is too expensive.", "a": "d7b54b81c4"}, {"th": "แม่ค้าลดให้เหลือห้าสิบบาท", "ro": "mâe-kháa lót hâi lǔea hâa-sìp bàat", "en": "The seller lowers it to 50 baht.", "a": "6a1350fab6"}, {"th": "ลูกอยากกินขนม แม่เลยซื้อให้หนึ่งถุง", "ro": "lûuk yàak gin khà-nǒm, mâe loei súue hâi nùeng thǔng", "en": "The child wants a snack, so she buys one bag.", "a": "3f7cbb5150"}, {"th": "ทั้งหมดสามร้อยบาท แม่จ่ายด้วยการสแกนคิวอาร์", "ro": "tháng-mòt sǎam ráwy bàat, mâe jàai dûay gaan sà-gaen khiw-aa", "en": "Altogether 300 baht. She pays by scanning a QR code.", "a": "32fdfcf284"}], "q": [{"q": "Which day do they go?", "o": ["Friday", "Saturday", "Sunday", "Monday"], "a": 1}, {"q": "What is the final price of mangoes per kilo?", "o": ["40 baht", "50 baht", "60 baht", "70 baht"], "a": 1}, {"q": "How does the mother pay?", "o": ["Cash", "Card", "By scanning a QR code", "She does not pay"], "a": 2}]}, {"id": "s3", "title": "The lost phone", "th": "โทรศัพท์หาย", "level": 2, "lines": [{"th": "เมื่อวานนิดลืมโทรศัพท์ไว้บนแท็กซี่", "ro": "mûea-waan Nít luuem thoo-rá-sàp wái bon tháek-sîi", "en": "Yesterday Nit left her phone in a taxi.", "a": "7da537a645"}, {"th": "เธอตกใจมาก เพราะในโทรศัพท์มีรูปเยอะ", "ro": "thoe dtòk-jai mâak, phráw nai thoo-rá-sàp mii rûup yóe", "en": "She was very upset, because there were lots of photos on it.", "a": "cf4b875225"}, {"th": "เพื่อนให้ยืมโทรศัพท์ แล้วเธอโทรเข้าเบอร์ตัวเอง", "ro": "phûean hâi yuuem thoo-rá-sàp, láew thoe thoo khâo boe dtua-eeng", "en": "A friend lent her a phone, and she called her own number.", "a": "aa48ed07a8"}, {"th": "คนขับแท็กซี่รับสาย เขาใจดีมาก", "ro": "khon khàp tháek-sîi ráp sǎai, kháo jai-dii mâak", "en": "The taxi driver answered. He was very kind.", "a": "49f5ff1c80"}, {"th": "เขาขับกลับมาส่งโทรศัพท์ให้ที่หน้าบ้าน", "ro": "kháo khàp glàp maa sòng thoo-rá-sàp hâi thîi nâa bâan", "en": "He drove back and returned the phone at her house.", "a": "7ebc341b63"}, {"th": "นิดให้เงินเขาห้าร้อยบาท และขอบคุณหลายครั้ง", "ro": "Nít hâi ngoen kháo hâa ráwy bàat láe khàwp-khun lǎai khráng", "en": "Nit gave him 500 baht and thanked him many times.", "a": "0c76a53756"}], "q": [{"q": "Where did Nit leave her phone?", "o": ["On a bus", "In a taxi", "At a restaurant", "At school"], "a": 1}, {"q": "Who answered the call?", "o": ["Her friend", "The police", "The taxi driver", "Her mother"], "a": 2}, {"q": "How much did Nit give him?", "o": ["100 baht", "300 baht", "500 baht", "1,000 baht"], "a": 2}]}, {"id": "s4", "title": "A rainy Sunday", "th": "วันอาทิตย์ฝนตก", "level": 3, "lines": [{"th": "วันอาทิตย์ แซมกับเพื่อนอยากไปเที่ยวอยุธยา", "ro": "wan aa-thít, Saem gàp phûean yàak bpai thîao à-yút-thá-yaa", "en": "On Sunday, Sam and a friend wanted to visit Ayutthaya.", "a": "e76a442a50"}, {"th": "แต่ตอนเช้าฝนตกหนักมาก", "ro": "dtàe dtawn cháao fǒn dtòk nàk mâak", "en": "But in the morning it rained very heavily.", "a": "d47a115ef1"}, {"th": "ถนนน้ำท่วม รถติดยาว", "ro": "thà-nǒn náam thûam, rót dtìt yaao", "en": "The roads flooded and the traffic jam was long.", "a": "813a6ff88c"}, {"th": "พวกเขาเลยเปลี่ยนแผน ไปดูหนังที่ห้างแทน", "ro": "phûak-kháo loei bplìan phǎen, bpai duu nǎng thîi hâang thaen", "en": "So they changed plans and watched a movie at the mall instead.", "a": "61a21be643"}, {"th": "หลังดูหนัง พวกเขากินชาบูด้วยกัน", "ro": "lǎng duu nǎng, phûak-kháo gin chaa-buu dûay-gan", "en": "After the movie, they ate shabu together.", "a": "8aa6bcee36"}, {"th": "แซมบอกว่า ไม่เป็นไร อาทิตย์หน้าค่อยไปอยุธยา", "ro": "Saem bàwk wâa, mâi bpen rai, aa-thít nâa khâwy bpai à-yút-thá-yaa", "en": "Sam said: never mind, we will go to Ayutthaya next week.", "a": "19118cee88"}], "q": [{"q": "Where did they want to go?", "o": ["Chiang Mai", "Ayutthaya", "The beach", "Bangkok"], "a": 1}, {"q": "Why did they change plans?", "o": ["They were sick", "No money", "Heavy rain and floods", "It was too hot"], "a": 2}, {"q": "What did they do instead?", "o": ["Stayed home", "Watched a movie", "Went shopping", "Went to a temple"], "a": 1}]}, {"id": "s5", "title": "The new student", "th": "นักเรียนใหม่", "level": 3, "lines": [{"th": "วันนี้มีนักเรียนใหม่ในห้องสี่ทับหนึ่ง", "ro": "wan-níi mii nák-rian mài nai hâwng sìi tháp nùeng", "en": "Today there is a new student in class 4/1.", "a": "848c26aff5"}, {"th": "เธอชื่อมิ้นท์ ย้ายมาจากภูเก็ต", "ro": "thoe chûue Mín, yáai maa jàak phuu-gèt", "en": "Her name is Mint. She moved here from Phuket.", "a": "ef848fd67d"}, {"th": "มิ้นท์ยังไม่มีเพื่อน เลยนั่งคนเดียว", "ro": "Mín yang mâi mii phûean, loei nâng khon diao", "en": "Mint has no friends yet, so she sits alone.", "a": "8b2a34d9d7"}, {"th": "ครูให้ทำงานเป็นคู่ และให้มิ้นท์นั่งกับฝ้าย", "ro": "khruu hâi tham-ngaan bpen khûu, láe hâi Mín nâng gàp Fâai", "en": "The teacher has everyone work in pairs and puts Mint with Fai.", "a": "28f71056f7"}, {"th": "สองคนคุยกันสนุก เพราะชอบเพลงเกาหลีเหมือนกัน", "ro": "sǎwng khon khui gan sà-nùk, phráw chôop phleeng gao-lǐi mǔean gan", "en": "The two chat happily because they both like Korean songs.", "a": "f848728216"}, {"th": "ตอนเที่ยง ทั้งสองไปกินข้าวด้วยกัน", "ro": "dtawn thîang, tháng sǎwng bpai gin khâao dûay-gan", "en": "At noon, they go to eat together.", "a": "6bf0d57d09"}], "q": [{"q": "Where is Mint from?", "o": ["Chiang Mai", "Bangkok", "Phuket", "Korea"], "a": 2}, {"q": "Why do Mint and Fai get along?", "o": ["Same village", "Both like Korean songs", "They are sisters", "Same sport"], "a": 1}, {"q": "What do they do at noon?", "o": ["Study", "Sleep", "Eat together", "Play football"], "a": 2}]}, {"id": "s6", "title": "Songkran in Chiang Mai", "th": "สงกรานต์ที่เชียงใหม่", "level": 3, "lines": [{"th": "สงกรานต์ปีที่แล้ว แซมไปเชียงใหม่เป็นครั้งแรก", "ro": "sǒng-graan bpii thîi láew, Saem bpai chiang-mài bpen khráng râek", "en": "Last Songkran, Sam went to Chiang Mai for the first time.", "a": "f1d5e38070"}, {"th": "ทุกถนนมีคนเล่นน้ำ ทั้งเด็กและผู้ใหญ่", "ro": "thúk thà-nǒn mii khon lên náam, tháng dèk láe phûu-yài", "en": "Every street had people playing with water, kids and adults.", "a": "807d604bac"}, {"th": "เขาเปียกตั้งแต่เช้าจนเย็น", "ro": "kháo bpìak dtâng-dtàe cháao jon yen", "en": "He was wet from morning till evening.", "a": "e47ad4e320"}, {"th": "โทรศัพท์ของเขาอยู่ในถุงกันน้ำ เลยไม่เสีย", "ro": "thoo-rá-sàp khǎwng kháo yùu nai thǔng gan náam, loei mâi sǐa", "en": "His phone was in a waterproof bag, so it did not break.", "a": "90d51bc09d"}, {"th": "ตอนเย็น เขาไปวัดและสรงน้ำพระ", "ro": "dtawn yen, kháo bpai wát láe sǒng náam phrá", "en": "In the evening he went to a temple and poured water over the Buddha images.", "a": "fe72e50a21"}, {"th": "เขาบอกว่าปีหน้าจะไปอีกแน่นอน", "ro": "kháo bàwk wâa bpii nâa jà bpai ìik nâe-nawn", "en": "He says he will definitely go again next year.", "a": "da3b89f7cd"}], "q": [{"q": "Was it his first time in Chiang Mai at Songkran?", "o": ["Yes", "No, the second time", "No, he goes every year", "The story does not say"], "a": 0}, {"q": "Why did his phone not break?", "o": ["He left it at the hotel", "It was in a waterproof bag", "He did not bring it", "A friend held it"], "a": 1}, {"q": "What did he do in the evening?", "o": ["Went to a temple", "Slept", "Went shopping", "Watched a movie"], "a": 0}]}, {"id": "s7", "title": "A sick colleague", "th": "เพื่อนครูไม่สบาย", "level": 4, "lines": [{"th": "เช้านี้ครูนกไม่สบาย เป็นไข้สูง", "ro": "cháao níi khruu Nók mâi sà-baai, bpen khâi sǔung", "en": "This morning Teacher Nok is sick with a high fever.", "a": "4478e363e6"}, {"th": "เธอโทรมาบอกห้องธุรการว่าขอลาป่วย", "ro": "thoe thoo maa bàwk hâwng thú-rá-gaan wâa khǎw laa bpùai", "en": "She called the office to ask for sick leave.", "a": "5e115aae0a"}, {"th": "ผอ. ขอให้แซมสอนแทนสองคาบ", "ro": "phaw-aw khǎw hâi Saem sǎwn thaen sǎwng khâap", "en": "The director asked Sam to teach in her place for two periods.", "a": "27b18aef4e"}, {"th": "แซมไม่รู้ว่าครูนกสอนอะไร เลยส่งไลน์ไปถาม", "ro": "Saem mâi rúu wâa khruu Nók sǎwn à-rai, loei sòng lai bpai thǎam", "en": "Sam did not know what Nok was teaching, so he asked her on LINE.", "a": "cabb8d3b83"}, {"th": "ครูนกส่งแผนการสอนมาให้ และขอบคุณมาก", "ro": "khruu Nók sòng phǎen gaan sǎwn maa hâi, láe khàwp-khun mâak", "en": "Nok sent him the lesson plan and thanked him a lot.", "a": "fd216bbaac"}, {"th": "หลังเลิกเรียน แซมซื้อผลไม้ไปเยี่ยมเธอ", "ro": "lǎng lôek rian, Saem súue phǒn-lá-mái bpai yîam thoe", "en": "After school, Sam bought some fruit and visited her.", "a": "1143945b49"}], "q": [{"q": "What is wrong with Teacher Nok?", "o": ["A headache", "A high fever", "A broken leg", "A toothache"], "a": 1}, {"q": "How many periods does Sam cover?", "o": ["One", "Two", "Three", "The whole day"], "a": 1}, {"q": "How did Sam ask what to teach?", "o": ["He phoned her", "On LINE", "By email", "He asked the director"], "a": 1}]}, {"id": "s8", "title": "Moving house", "th": "ย้ายห้อง", "level": 4, "lines": [{"th": "ห้องเก่าของแซมเล็กและร้อนมาก", "ro": "hâwng gào khǎwng Saem lék láe ráwn mâak", "en": "Sam's old room was small and very hot.", "a": "3d487d3980"}, {"th": "แอร์เสียบ่อย และน้ำไม่ค่อยไหล", "ro": "ae sǐa bàwy, láe náam mâi khâwy lǎi", "en": "The air-con often broke and the water hardly ran.", "a": "42e5d8fb1d"}, {"th": "เขาเลยหาห้องใหม่ใกล้โรงเรียน", "ro": "kháo loei hǎa hâwng mài glâi roong-rian", "en": "So he looked for a new room near the school.", "a": "92057aecf5"}, {"th": "ห้องใหม่ค่าเช่าหกพันบาท แพงกว่าเดิมหนึ่งพัน", "ro": "hâwng mài khâa châo hòk phan bàat, phaeng gwàa doem nùeng phan", "en": "The new room is 6,000 baht a month — 1,000 more than before.", "a": "dd55bc5729"}, {"th": "แต่เดินไปทำงานได้ ไม่ต้องเสียค่ารถ", "ro": "dtàe doen bpai tham-ngaan dâai, mâi dtâwng sǐa khâa rót", "en": "But he can walk to work and does not have to pay for transport.", "a": "021cad039e"}, {"th": "เพื่อนครูสามคนมาช่วยขนของ", "ro": "phûean khruu sǎam khon maa chûay khǒn khǎwng", "en": "Three teacher friends came to help move his things.", "a": "a64e05340a"}], "q": [{"q": "What was wrong with the old room?", "o": ["Too far away", "Small and hot", "Too expensive", "Noisy neighbours"], "a": 1}, {"q": "How much is the new rent?", "o": ["5,000 baht", "6,000 baht", "7,000 baht", "1,000 baht"], "a": 1}, {"q": "Who helped him move?", "o": ["The landlord", "His family", "Three teacher friends", "His students"], "a": 2}]}, {"id": "s9", "title": "A weekend in Hua Hin", "th": "เที่ยวหัวหิน", "level": 4, "lines": [{"th": "สุดสัปดาห์นี้ฝ้ายกับครอบครัวไปทะเลที่หัวหิน", "ro": "sùt-sàp-daa níi Fâai gàp khrâwp-khrua bpai thá-lee thîi hǔa-hǐn", "en": "This weekend Fai and her family went to the beach at Hua Hin.", "a": "39285b3e98"}, {"th": "พวกเขาออกจากบ้านตีห้า เพราะไม่อยากเจอรถติด", "ro": "phûak-kháo àwk jàak bâan dtii hâa, phráw mâi yàak joe rót dtìt", "en": "They left home at 5 a.m. because they did not want to hit traffic.", "a": "0ee9fc4864"}, {"th": "ฝ้ายว่ายน้ำทั้งวัน ส่วนพ่อนอนอ่านหนังสือ", "ro": "Fâai wâai-náam tháng wan, sùan phâw nawn àan nǎng-sǔue", "en": "Fai swam all day, while her father lay reading a book.", "a": "08efaf6181"}, {"th": "ตอนเย็นพวกเขากินอาหารทะเลที่ตลาดโต้รุ่ง", "ro": "dtawn yen phûak-kháo gin aa-hǎan thá-lee thîi dtà-làat dtôo-rûng", "en": "In the evening they ate seafood at the night market.", "a": "fca554a4cf"}, {"th": "แม่สั่งปูกับกุ้งเผา แต่ฝ้ายแพ้กุ้ง เลยกินปลา", "ro": "mâe sàng bpuu gàp gûng phǎo, dtàe Fâai pháe gûng, loei gin bplaa", "en": "Mum ordered crab and grilled shrimp, but Fai is allergic to shrimp, so she ate fish.", "a": "8ad06b10d3"}, {"th": "ทุกคนเหนื่อย แต่สนุกมาก", "ro": "thúk khon nùeai, dtàe sà-nùk mâak", "en": "Everyone was tired, but they had a lot of fun.", "a": "29336d68ce"}], "q": [{"q": "Where did they go?", "o": ["Pattaya", "Phuket", "Hua Hin", "Bang Saen"], "a": 2}, {"q": "Why did they leave at 5 a.m.?", "o": ["It was cooler", "To avoid traffic", "To see the sunrise", "Cheap tickets"], "a": 1}, {"q": "What did Fai eat?", "o": ["Shrimp", "Crab", "Fish", "Chicken"], "a": 2}]}, {"id": "s10", "title": "My first time in Thailand", "th": "มาเมืองไทยครั้งแรก", "level": 5, "lines": [{"th": "ห้าปีก่อน แซมมาเมืองไทยครั้งแรก", "ro": "hâa bpii gàwn, Saem maa mueang thai khráng râek", "en": "Five years ago, Sam came to Thailand for the first time.", "a": "3b3444c34e"}, {"th": "เขาพูดไทยไม่ได้เลย รู้แค่คำว่าสวัสดีกับขอบคุณ", "ro": "kháo phûut thai mâi dâai loei, rúu khâe kham wâa sà-wàt-dii gàp khàwp-khun", "en": "He could not speak Thai at all. He only knew \"hello\" and \"thank you\".", "a": "63904a63bb"}, {"th": "วันแรกเขาสั่งข้าวผัด แต่ได้ส้มตำเผ็ดมาก", "ro": "wan râek kháo sàng khâao-phàt, dtàe dâai sôm-dtam phèt mâak", "en": "On the first day he ordered fried rice but got a very spicy papaya salad.", "a": "77d248d442"}, {"th": "เขากินไม่ไหว น้ำตาไหลเลย", "ro": "kháo gin mâi wǎi, nám-dtaa lǎi loei", "en": "He could not eat it — tears ran down his face.", "a": "5dd3bd15d1"}, {"th": "ตอนนี้เขาพูดไทยได้มากขึ้น และกินเผ็ดเก่งแล้ว", "ro": "dtawn-níi kháo phûut thai dâai mâak khûen, láe gin phèt gèng láew", "en": "Now he speaks much more Thai and eats spicy food easily.", "a": "613d6bf42a"}, {"th": "เขาบอกว่า เรียนทุกวัน วันละนิดก็พอ", "ro": "kháo bàwk wâa, rian thúk wan, wan lá nít gâw phaw", "en": "He says: study every day — a little each day is enough.", "a": "bcfb990fef"}], "q": [{"q": "When did Sam first come to Thailand?", "o": ["One year ago", "Three years ago", "Five years ago", "Ten years ago"], "a": 2}, {"q": "What did he get on his first day?", "o": ["Fried rice", "Very spicy papaya salad", "Noodles", "Nothing"], "a": 1}, {"q": "What is his advice?", "o": ["Study a lot at weekends", "Study a little every day", "Watch Thai TV", "Live with a Thai family"], "a": 1}]}], "convos": [{"id": "c01", "level": 2, "title": "Papaya salad at a street stall", "th": "ร้านส้มตำ", "scene": "You stop at a som tam stall on your way home.", "lines": [{"w": "A", "en": "What would you like?", "th": {"m": "กินอะไรดีคะ", "f": "กินอะไรดีครับ"}, "ro": {"m": "gin à-rai dii khá", "f": "gin à-rai dii khráp"}, "a": {"m": "702bfe1f55", "f": "fdb5a1722f"}}, {"w": "Y", "en": "One Thai papaya salad, please.", "th": {"m": "ส้มตำไทยจานหนึ่งครับ", "f": "ส้มตำไทยจานหนึ่งค่ะ"}, "ro": {"m": "sôm-dtam thai jaan nùeng khráp", "f": "sôm-dtam thai jaan nùeng khâ"}, "a": {"m": "f6cc9a2c4c", "f": "e86650b3ca"}, "wrong": ["Where is the bathroom?", "I'm a teacher."]}, {"w": "A", "en": "How many chillies?", "th": {"m": "เผ็ดกี่เม็ดคะ", "f": "เผ็ดกี่เม็ดครับ"}, "ro": {"m": "phèt gìi mét khá", "f": "phèt gìi mét khráp"}, "a": {"m": "bb326ba2f7", "f": "e5c75df43d"}}, {"w": "Y", "en": "Just one is enough — not too spicy.", "th": {"m": "เม็ดเดียวพอครับ ไม่เอาเผ็ดมาก", "f": "เม็ดเดียวพอค่ะ ไม่เอาเผ็ดมาก"}, "ro": {"m": "mét diao phaw khráp, mâi ao phèt mâak", "f": "mét diao phaw khâ, mâi ao phèt mâak"}, "a": {"m": "d0db4cc23f", "f": "50e7803828"}, "wrong": ["Three hundred baht.", "I'm going home."]}, {"w": "A", "en": "With peanuts?", "th": {"m": "ใส่ถั่วไหมคะ", "f": "ใส่ถั่วไหมครับ"}, "ro": {"m": "sài thùa mǎi khá", "f": "sài thùa mǎi khráp"}, "a": {"m": "17d2d3b889", "f": "589d353ad3"}}, {"w": "Y", "en": "Yes, please.", "th": {"m": "ใส่ครับ", "f": "ใส่ค่ะ"}, "ro": {"m": "sài khráp", "f": "sài khâ"}, "a": {"m": "fc3579df6d", "f": "501d45a13d"}, "wrong": ["I'm from America.", "It's too far."]}, {"w": "A", "en": "Eat here or take away?", "th": {"m": "กินที่นี่หรือกลับบ้านคะ", "f": "กินที่นี่หรือกลับบ้านครับ"}, "ro": {"m": "gin thîi-nîi rǔe glàp bâan khá", "f": "gin thîi-nîi rǔe glàp bâan khráp"}, "a": {"m": "ab884a603d", "f": "1bd182d506"}}, {"w": "Y", "en": "Take away — and some sticky rice too.", "th": {"m": "กลับบ้านครับ ขอข้าวเหนียวด้วย", "f": "กลับบ้านค่ะ ขอข้าวเหนียวด้วย"}, "ro": {"m": "glàp bâan khráp, khǎw khâao-nǐao dûay", "f": "glàp bâan khâ, khǎw khâao-nǐao dûay"}, "a": {"m": "3086b3241b", "f": "1bd90436cc"}, "wrong": ["Turn left here.", "I'm very tired."]}, {"w": "A", "en": "That's 60 baht altogether.", "th": {"m": "ทั้งหมดหกสิบบาทค่ะ", "f": "ทั้งหมดหกสิบบาทครับ"}, "ro": {"m": "tháng-mòt hòk-sìp bàat khâ", "f": "tháng-mòt hòk-sìp bàat khráp"}, "a": {"m": "9f082c8dc4", "f": "7209745ce6"}}, {"w": "Y", "en": "Can I pay by transfer?", "th": {"m": "โอนได้ไหมครับ", "f": "โอนได้ไหมคะ"}, "ro": {"m": "oon dâai mǎi khráp", "f": "oon dâai mǎi khá"}, "a": {"m": "af6164e2e0", "f": "34e56b844a"}, "wrong": ["How old are you?", "Is it far?"]}, {"w": "A", "en": "Sure, scan here.", "th": {"m": "ได้ค่ะ สแกนตรงนี้เลย", "f": "ได้ครับ สแกนตรงนี้เลย"}, "ro": {"m": "dâai khâ, sà-gaen dtrong-níi loei", "f": "dâai khráp, sà-gaen dtrong-níi loei"}, "a": {"m": "3f42c0a9e1", "f": "336196046f"}}, {"w": "Y", "en": "Done. Thank you.", "th": {"m": "โอนแล้วครับ ขอบคุณครับ", "f": "โอนแล้วค่ะ ขอบคุณค่ะ"}, "ro": {"m": "oon láew khráp, khàwp-khun khráp", "f": "oon láew khâ, khàwp-khun khâ"}, "a": {"m": "91a4485b07", "f": "8d2a694f89"}, "wrong": ["I don't understand.", "See you on Monday."]}]}, {"id": "c02", "level": 2, "title": "Chatting with a Grab driver", "th": "คุยกับคนขับแกร็บ", "scene": "You get into a Grab car to go to school. The driver is friendly.", "lines": [{"w": "A", "en": "Hello, going to the school, right?", "th": {"m": â, mâi khúm", "f": "rót dtìt mâak khráp, mâi khúm"}, "a": {"m": "1f716a0209", "f": "747858e446"}}, {"w": "Y", "en": "Never mind then — I'll call a Grab instead.", "th": {"m": "งั้นไม่เป็นไรครับ ผมเรียกแกร็บดีกว่า", "f": "งั้นไม่เป็นไรค่ะ ฉันเรียกแกร็บดีกว่า"}, "ro": {"m": "ngán mâi bpen rai khráp, phǒm rîak gràep dii gwàa", "f": "ngán mâi bpen rai khâ, chǎn rîak gràep dii gwàa"}, "a": {"m": "64f2a20703", "f": "ad97b02da2"}, "wrong": ["OK, 500 is cheap!", "Then let's eat first."]}, {"w": "A", "en": "Wait, wait — 400 is fine.", "th": {"m": "เดี๋ยวๆ สี่ร้อยก็ได้ค่ะ", "f": "เดี๋ยวๆ สี่ร้อยก็ได้ครับ"}, "ro": {"m": "dǐao-dǐao, sìi ráwy gâw dâai khâ", "f": "dǐao-dǐao, sìi ráwy gâw dâai khráp"}, "a": {"m": "8331750d28", "f": "69503f870f"}}, {"w": "Y", "en": "350, including the expressway toll?", "th": {"m": "สามร้อยห้าสิบ รวมค่าทางด่วนนะครับ", "f": "สามร้อยห้าสิบ รวมค่าทางด่วนนะคะ"}, "ro": {"m": "sǎam ráwy hâa-sìp, ruam khâa thaang-dùan ná khráp", "f": "sǎam ráwy hâa-sìp, ruam khâa thaang-dùan ná khá"}, "a": {"m": "b40825f4f4", "f": "79f5dddebc"}, "wrong": ["400 and a coffee?", "500, thank you!"]}, {"w": "A", "en": "OK, get in.", "th": {"m": "โอเค ขึ้นมาเลยค่ะ", "f": "โอเค ขึ้นมาเลยครับ"}, "ro": {"m": "oo-khee, khûen maa loei khâ", "f": "oo-khee, khûen maa loei khráp"}, "a": {"m": "e11cc4a96b", "f": "f147316946"}}]}], "reads": [{"id": "r1", "sec": "Start here", "title": "How Thai writing works", "th": "อักษรไทย", "intro": ["Thai is written left to right, with <b>no spaces between words</b> — spaces mark the end of a phrase or sentence.", "There are <b>44 consonants</b>. Each has a name, like “A for apple”: ก is <b>gaw gài</b> — g as in chicken.", "Vowels sit <b>around</b> the consonant: after it (กา), above it (กี), below it (กู), or even before it (เก). You always <b>say the consonant first</b>.", "Every syllable has one of <b>5 tones</b>. The writing tells you the tone: the consonant's class, the ending sound and any tone mark. You will learn the rules step by step."], "quiz": ["read", "spell"], "trace": true, "words": [{"th": "กา", "ro": "gaa", "en": "crow", "a": "6a2ad9d1e8"}, {"th": "กี", "ro": "gii", "en": "(vowel above)", "a": "adf0b08eef"}, {"th": "กู", "ro": "guu", "en": "(vowel below)", "a": "9ad360e315"}, {"th": "เก", "ro": "gee", "en": "(vowel in front)", "a": "35465f08b1"}, {"th": "มา", "ro": "maa", "en": "to come", "a": "8576535531"}, {"th": "ดี", "ro": "dii", "en": "good", "a": "bc043b80fc"}, {"th": "ดู", "ro": "duu", "en": "to look", "a": "239932eed8"}, {"th": "ตา", "ro": "dtaa", "en": "eye / grandfather", "a": "1345226798"}]}, {"id": "r2", "sec": "Reading words", "title": "Your first syllables", "th": "พยัญชนะ + สระ", "intro": ["A consonant + a <b>long vowel</b> makes a syllable: ม + า = <b>มา</b> (maa).", "With mid- or low-class letters, no ending and no tone mark, the tone is <b>mid</b> (flat). All the words here are mid tone.", "Remember: เ แ โ ไ ใ are <b>written before</b> the consonant but <b>said after</b> it: ไป = bp + ai = <b>bpai</b>."], "quiz": ["read", "spell", "mean"], "trace": true, "words": [{"th": "มา", "ro": "maa", "en": "to come", "a": "8576535531"}, {"th": "ดี", "ro": "dii", "en": "good", "a": "bc043b80fc"}, {"th": "ปู", "ro": "bpuu", "en": "crab", "a": "4db39bba69"}, {"th": "งู", "ro": "nguu", "en": "snake", "a": "5092276a98"}, {"th": "นา", "ro": "naa", "en": "rice field", "a": "be4c7f98df"}, {"th": "ยา", "ro": "yaa", "en": "medicine", "a": "5f7333d089"}, {"th": "มือ", "ro": "muue", "en": "hand", "a": "472790bbae"}, {"th": "รอ", "ro": "raw", "en": "to wait", "a": "7403931616"}, {"th": "พอ", "ro": "phaw", "en": "enough", "a": "9073d0f7ad"}, {"th": "ปลา", "ro": "bplaa", "en": "fish", "a": "718e12c068"}, {"th": "ไป", "ro": "bpai", "en": "to go", "a": "fbf247c9e2"}, {"th": "ใจ", "ro": "jai", "en": "heart, mind", "a": "07d10e05bf"}, {"th": "เรา", "ro": "rao", "en": "we", "a": "20b9ba9809"}, {"th": "โต", "ro": "dtoo", "en": "big, to grow", "a": "06121fb86e"}, {"th": "ทา", "ro": "thaa", "en": "to apply, to paint", "a": "53cba0df52"}]}, {"id": "r3", "sec": "Reading words", "title": "Ending sounds", "th": "ตัวสะกด", "intro": ["Only a few sounds can end a Thai syllable. <b>Ringing endings</b> (the sound can go on):  <b>-n, -m, -ng, -i/-y, -o/-w</b> (น ม ง ย ว — and ญ ณ ร ล ฬ also say -n).", "<b>Stopped endings</b> (the sound is cut short): <b>-k</b> (ก ข ค…), <b>-t</b> (ด ต จ ช ซ ส ศ ษ…), <b>-p</b> (บ ป พ ฟ ภ). So บาท is <b>bàat</b>, not \"baht\".", "Why it matters: a stopped ending changes the tone. Mid-class letter + stopped ending = <b>low tone</b>: ปาก bpàak, กบ gòp."], "quiz": ["read", "spell", "mean"], "trace": true, "words": [{"th": "กิน", "ro": "gin", "en": "to eat", "a": "decb398fc2"}, {"th": "นอน", "ro": "nawn", "en": "to sleep", "a": "d4f179b227"}, {"th": "งาน", "ro": "ngaan", "en": "work", "a": "87319afe2c"}, {"th": "ลม", "ro": "lom", "en": "wind", "a": "096cadab2b"}, {"th": "ยาว", "ro": "yaao", "en": "long", "a": "c13d1f36b5"}, {"th": "จาน", "ro": "jaan", "en": "plate", "a": "238532f2fc"}, {"th": "ดาว", "ro": "daao", "en": "star", "a": "fd6f37b0ba"}, {"th": "ปาก", "ro": "bpàak", "en": "mouth", "a": "d893b34838"}, {"th": "กบ", "ro": "gòp", "en": "frog", "a": "b984294bf4"}, {"th": "ตก", "ro": "dtòk", "en": "to fall", "a": "43edf5a18f"}, {"th": "แปด", "ro": "bpàet", "en": "eight", "a": "4b881386c2"}, {"th": "บาท", "ro": "bàat", "en": "baht", "a": "14581094b9"}, {"th": "กับ", "ro": "gàp", "en": "with", "a": "2ec901359b"}, {"th": "อาบ", "ro": "àap", "en": "to bathe", "a": "102fd088d3"}, {"th": "จบ", "ro": "jòp", "en": "to finish", "a": "cc4f6e9f99"}]}, {"id": "r4", "sec": "Reading words", "title": "Hidden vowels", "th": "สระลดรูป", "intro": ["Two consonants with no vowel between them? There is a <b>hidden \"o\"</b>: คน = kh-o-n = <b>khon</b> (person), นก = <b>nók</b> (bird).", "A consonant at the start with nothing after it often gets a <b>hidden short \"a\"</b>: สบาย = s(a)-baai = <b>sà-baai</b>.", "You can't always see it — that's why you learn words by listening first. Tap each word and listen."], "quiz": ["read", "mean", "spell"], "trace": true, "words": [{"th": "คน", "ro": "khon", "en": "person", "a": "9cc1071285"}, {"th": "นก", "ro": "nók", "en": "bird", "a": "ae09012df5"}, {"th": "ลม", "ro": "lom", "en": "wind", "a": "096cadab2b"}, {"th": "รถ", "ro": "rót", "en": "car", "a": "5f17a472f8"}, {"th": "ผม", "ro": "phǒm", "en": "hair / I (men)", "a": "29cb25bf12"}, {"th": "ฝน", "ro": "fǒn", "en": "rain", "a": "f943c6d755"}, {"th": "สบาย", "ro": "sà-baai", "en": "comfortable, well", "a": "b24e97068a"}, {"th": "ถนน", "ro": "thà-nǒn", "en": "road", "a": "43cfd1623f"}, {"th": "ตลาด", "ro": "dtà-làat", "en": "market", "a": "f274fa41ec"}, {"th": "ขนม", "ro": "khà-nǒm", "en": "snack, dessert", "a": "b26655a26a"}, {"th": "สนุก", "ro": "sà-nùk", "en": "fun", "a": "050b524f07"}]}, {"id": "r5", "sec": "Tones in writing", "title": "Tone rules 1: mid-class letters", "th": "อักษรกลาง", "intro": ["Mid class: <b>ก จ ด ต ฎ ฏ บ ป อ</b> (a memory trick: “gai jik dek dtai bon bpak ong” — chicken pecks child dying on a jar).", "No mark + live ending → <b>mid</b> (กา gaa). No mark + dead ending → <b>low</b> (ปิด bpìt).", "With marks: ่ → <b>low</b> (ไก่ gài) · ้ → <b>falling</b> (ต้ม dtôm) · ๊ → <b>high</b> (โต๊ะ dtó) · ๋ → <b>rising</b> (ตั๋ว dtǔa). Mid class is the only class that uses all four marks."], "quiz": ["tone", "read", "spell"], "trace": false, "words": [{"th": "ไก่", "ro": "gài", "en": "chicken", "a": "50eed27cc4"}, {"th": "ต้ม", "ro": "dtôm", "en": "to boil", "a": "9d5f879112"}, {"th": "โต๊ะ", "ro": "dtó", "en": "table", "a": "09f5b03ef7"}, {"th": "ตั๋ว", "ro": "dtǔa", "en": "ticket", "a": "f35cb9bcb3"}, {"th": "บ้าน", "ro": "bâan", "en": "house", "a": "12204e0f14"}, {"th": "ปิด", "ro": "bpìt", "en": "to close", "a": "0a229fb979"}, {"th": "เก่ง", "ro": "gèng", "en": "skilful, good at", "a": "cf7d0c0310"}, {"th": "ได้", "ro": "dâai", "en": "can, get", "a": "c970d5cd06"}, {"th": "ดำ", "ro": "dam", "en": "black", "a": "3dcebaf86e"}, {"th": "จ๋า", "ro": "jǎa", "en": "(sweet answer: \"yes, dear\")", "a": "84d9365f0b"}, {"th": "อ่าน", "ro": "àan", "en": "to read", "a": "2287bfbd81"}, {"th": "ป้า", "ro": "bpâa", "en": "aunt", "a": "690941ab3d"}]}, {"id": "r6", "sec": "Tones in writing", "title": "Tone rules 2: high-class letters", "th": "อักษรสูง", "intro": ["High class: <b>ข ฃ ฉ ฐ ถ ผ ฝ ศ ษ ส ห</b>.", "No mark + live ending → <b>rising</b> (ขา khǎa). No mark + dead ending → <b>low</b> (สิบ sìp).", "With marks: ่ → <b>low</b> (ข่าว khàao) · ้ → <b>falling</b> (ข้าว khâao). High-class letters never take ๊ or ๋."], "quiz": ["tone", "read", "mean"], "trace": false, "words": [{"th": "ขา", "ro": "khǎa", "en": "leg", "a": "835c92202a"}, {"th": "สี", "ro": "sǐi", "en": "colour", "a": "9acba894d6"}, {"th": "หู", "ro": "hǔu", "en": "ear", "a": "7cd347f0ed"}, {"th": "ผม", "ro": "phǒm", "en": "hair", "a": "29cb25bf12"}, {"th": "สวย", "ro": "sǔay", "en": "beautiful", "a": "fcc8f58212"}, {"th": "สิบ", "ro": "sìp", "en": "ten", "a": "c07e4d8559"}, {"th": "ถูก", "ro": "thùuk", "en": "cheap / correct", "a": "246ae53df1"}, {"th": "ผัด", "ro": "phàt", "en": "stir-fried", "a": "b8696129f5"}, {"th": "ข่าว", "ro": "khàao", "en": "news", "a": "6953827c9a"}, {"th": "ถ่าย", "ro": "thàai", "en": "to take (a photo)", "a": "d843dccf93"}, {"th": "ข้าว", "ro": "khâao", "en": "rice", "a": "446b15bc1b"}, {"th": "ห้า", "ro": "hâa", "en": "five", "a": "49bb84eebe"}, {"th": "ผ้า", "ro": "phâa", "en": "cloth", "a": "a0e79e12cc"}]}, {"id": "r7", "sec": "Tones in writing", "title": "Tone rules 3: low-class letters", "th": "อักษรต่ำ", "intro": ["Low class: <b>all the other 24 letters</b> — ค ง ช ซ ท น พ ฟ ม ย ร ล ว …", "No mark + live → <b>mid</b> (มา). Dead + <b>short</b> vowel → <b>high</b> (รัก rák). Dead + <b>long</b> vowel → <b>falling</b> (มาก mâak).", "Watch out — the marks “shift up” for low class: ่ → <b>falling</b> (แม่ mâe) · ้ → <b>high</b> (ม้า máa)."], "quiz": ["tone", "read", "mean"], "trace": false, "words": [{"th": "คน", "ro": "khon", "en": "person", "a": "9cc1071285"}, {"th": "รัก", "ro": "rák", "en": "to love", "a": "ab28f9dc4c"}, {"th": "นก", "ro": "nók", "en": "bird", "a": "ae09012df5"}, {"th": "ลด", "ro": "lót", "en": "to reduce", "a": "4f82da412b"}, {"th": "มาก", "ro": "mâak", "en": "very, a lot", "a": "cbcd6e372b"}, {"th": "ลูก", "ro": "lûuk", "en": "child", "a": "d4f0b7fc95"}, {"th": "พูด", "ro": "phûut", "en": "to speak", "a": "2734c34207"}, {"th": "ชอบ", "ro": "chôop", "en": "to like", "a": "9e78bfacda"}, {"th": "แม่", "ro": "mâe", "en": "mother", "a": "02cfbfb6f1"}, {"th": "พ่อ", "ro": "phâw", "en": "father", "a": "d07b402c7e"}, {"th": "ไม่", "ro": "mâi", "en": "not", "a": "77fc52c4cd"}, {"th": "ม้า", "ro": "máa", "en": "horse", "a": "6160af8173"}, {"th": "ร้อน", "ro": "ráwn", "en": "hot", "a": "389138a816"}, {"th": "ซื้อ", "ro": "súue", "en": "to buy", "a": "01be9e7faa"}]}, {"id": "r8", "sec": "Tones in writing", "title": "Silent ห and อ", "th": "ห นำ · อ นำ", "intro": ["A silent <b>ห</b> in front of ง ญ น ม ย ร ล ว makes the letter behave like <b>high class</b>: หมา = <b>mǎa</b> (dog, rising) vs มา maa.", "So หม-, หน-, หล-, หว- words follow high-class rules: หมู mǔu (rising), หนัก nàk (dead → low), หน้า nâa (้ → falling).", "A silent <b>อ</b> before ย does the same with mid-class rules — only 4 words: อยู่ yùu, อยาก yàak, อย่า yàa, อย่าง yàang."], "quiz": ["tone", "read", "spell"], "trace": false, "words": [{"th": "หมา", "ro": "mǎa", "en": "dog", "a": "92024136bd"}, {"th": "หมู", "ro": "mǔu", "en": "pig, pork", "a": "a3bc4efdb3"}, {"th": "หนู", "ro": "nǔu", "en": "mouse / I (girls)", "a": "f0632143b8"}, {"th": "หมอ", "ro": "mǎw", "en": "doctor", "a": "357bf03bd3"}, {"th": "หวาน", "ro": "wǎan", "en": "sweet", "a": "bea29d0eb3"}, {"th": "หลาย", "ro": "lǎai", "en": "many", "a": "32530787a2"}, {"th": "หนัก", "ro": "nàk", "en": "heavy", "a": "0b10f2f946"}, {"th": "ใหม่", "ro": "mài", "en": "new", "a": "cd616791fc"}, {"th": "หน้า", "ro": "nâa", "en": "face, front", "a": "  "Learn the 5 meats and 5 cooking words below and you can read most of a street menu."], "quiz": ["mean", "read", "spell"], "trace": false, "words": [{"th": "ข้าว", "ro": "khâao", "en": "rice", "a": "446b15bc1b"}, {"th": "ผัด", "ro": "phàt", "en": "stir-fried", "a": "b8696129f5"}, {"th": "ต้ม", "ro": "dtôm", "en": "boiled, soup", "a": "9d5f879112"}, {"th": "ทอด", "ro": "thâwt", "en": "deep-fried", "a": "76cd9b1979"}, {"th": "ย่าง", "ro": "yâang", "en": "grilled", "a": "2badf92d87"}, {"th": "ไก่", "ro": "gài", "en": "chicken", "a": "50eed27cc4"}, {"th": "หมู", "ro": "mǔu", "en": "pork", "a": "a3bc4efdb3"}, {"th": "เนื้อ", "ro": "núea", "en": "beef", "a": "591d9531ff"}, {"th": "กุ้ง", "ro": "gûng", "en": "shrimp", "a": "4d98f1e113"}, {"th": "ปลา", "ro": "bplaa", "en": "fish", "a": "718e12c068"}, {"th": "ไข่ดาว", "ro": "khài-daao", "en": "fried egg", "a": "a3c640d23a"}, {"th": "ผัก", "ro": "phàk", "en": "vegetables", "a": "869fffdc03"}, {"th": "ข้าวผัดไก่", "ro": "khâao-phàt gài", "en": "chicken fried rice", "a": "0fdfeb3a48"}, {"th": "ต้มยำกุ้ง", "ro": "dtôm-yam gûng", "en": "tom yum shrimp soup", "a": "9be068ed54"}, {"th": "ผัดกะเพราหมู", "ro": "phàt grà-phrao mǔu", "en": "pork with holy basil", "a": "9303a76d6b"}, {"th": "น้ำเปล่า", "ro": "nám-bplàao", "en": "drinking water", "a": "576efc89c2"}]}], "units": [{"id": "hello", "title": "Hello & polite words", "th": "สวัสดี", "icon": "wave", "goal": "Greet people, thank them and say sorry — politely.", "level": 1, "how": "", "phrases": [{"id": "hello0", "en": "Hello / Goodbye", "note": "One word for hello AND goodbye. Men end with khráp, women with khâ.", "th": {"m": "สวัสดีครับ", "f": "สวัสดีค่ะ"}, "ro": {"m": "sà-wàt-dii khráp", "f": "sà-wàt-dii khâ"}, "a": {"m": "4e69af0679", "f": "c0cb860fa1"}}, {"id": "hello1", "en": "How are you?", "note": "mǎi at the end turns a sentence into a yes/no question.", "th": {"m": "สบายดีไหมครับ", "f": "สบายดีไหมคะ"}, "ro": {"m": "sà-baai dii mǎi khráp", "f": "sà-baai dii mǎi khá"}, "a": {"m": "08385457b9", "f": "9045f25c6b"}}, {"id": "hello2", "en": "I'm fine.", "note": "", "th": {"m": "สบายดีครับ", "f": "สบายดีค่ะ"}, "ro": {"m": "sà-baai dii khráp", "f": "sà-baai dii khâ"}, "a": {"m": "3e59cb7dc9", "f": "5492f7c8ee"}}, {"id": "hello3", "en": "And you?", "note": "", "th": {"m": "แล้วคุณล่ะ", "f": "แล้วคุณล่ะ"}, "ro": {"m": "láew khun lâ", "f": "láew khun lâ"}, "a": {"m": "daa7b28153", "f": "0b5de53226"}}, {"id": "hello4", "en": "Thank you.", "note": "", "th": {"m": "ขอบคุณครับ", "f": "ขอบคุณค่ะ"}, "ro": {"m": "khàwp-khun khráp", "f": "khàwp-khun khâ"}, "a": {"m": "89befe85dd", "f": "b18424beb6"}}, {"id": "hello5", "en": "Thank you very much.", "note": "", "th": {"m": "ขอบคุณมากครับ", "f": "ขอบคุณมากค่ะ"}, "ro": {"m": "khàwp-khun mâak khráp", "f": "khàwp-khun mâak khâ"}, "a": {"m": "f329987c0d", "f": "b604be3ff2"}}, {"id": "hello6", "en": "No problem / It's OK / Never mind.", "note": "You will hear this all day in Thailand.", "th": {"m": "ไม่เป็นไรครับ", "f": "ไม่เป็นไรค่ะ"}, "ro": {"m": "mâi bpen rai khráp", "f": "mâi bpen rai khâ"}, "a": {"m": "92a5dbdd3b", "f": "3067288f66"}}, {"id": "hello7", "en": "Sorry / Excuse me.", "note": "", "th": {"m": "ขอโทษครับ", "f": "ขอโทษค่ะ"}, "ro": {"m": "khǎw-thôot khráp", "f": "khǎw-thôot khâ"}, "a": {"m": "6d2bfe6738", "f": "c998504c2f"}}, {"id": "hello8", "en": "Yes, that's right.", "note": "", "th": {"m": "ใช่", "f": "ใช่"}, "ro": {"m": "châi", "f": "châi"}, "a": {"m": "32866c0c26", "f": "12b77b0f63"}}, {"id": "hello9", "en": "No, that's not right.", "note": "mâi = not. Put it before a word to make it negative.", "th": {"m": "ไม่ใช่", "f": "ไม่ใช่"}, "ro": {"m": "mâi châi", "f": "mâi châi"}, "a": {"m": "89cc34bac0", "f": "532c9c2a1f"}}, {"id": "hello10", "en": "Nice to meet you.", "note": "", "th": {"m": "ยินดีที่ได้รู้จักครับ", "f": "ยินดีที่ได้รู้จักค่ะ"}, "ro": {"m": "yin-dii thîi dâai rúu-jàk khráp", "f": "yin-dii thîi dâai rúu-jàk khâ"}, "a": {"m": "1946957c81", "f": "a2a49bc229"}}, {"id": "hello11",
