t you are doing now.", "level": 3, "how": "จะ (jà) before a verb = will / going to. กำลัง (gam-lang) before a verb = in the middle of doing it. อยู่ (yùu) at the end also means \"right now\".", "phrases": [{"id": "future0", "en": "I'll go tomorrow.", "note": "", "th": {"m": "ผมจะไปพรุ่งนี้ครับ", "f": "ฉันจะไปพรุ่งนี้ค่ะ"}, "ro": {"m": "phǒm jà bpai phrûng-níi khráp", "f": "chǎn jà bpai phrûng-níi khâ"}, "a": {"m": "ab313377b3", "f": "96b932534b"}}, {"id": "future1", "en": "What are you going to do?", "note": "", "th": {"m": "คุณจะทำอะไร", "f": "คุณจะทำอะไร"}, "ro": {"m": "khun jà tham à-rai", "f": "khun jà tham à-rai"}, "a": {"m": "f0eb703398", "f": "5f079e237e"}}, {"id": "future2", "en": "I'm eating right now.", "note": "", "th": {"m": "ผมกำลังกินข้าวครับ", "f": "ฉันกำลังกินข้าวค่ะ"}, "ro": {"m": "phǒm gam-lang gin khâao khráp", "f": "chǎn gam-lang gin khâao khâ"}, "a": {"m": "6c256d9686", "f": "8af74c1af7"}}, {"id": "future3", "en": "I'm on my way.", "note": "", "th": {"m": "กำลังไป", "f": "กำลังไป"}, "ro": {"m": "gam-lang bpai", "f": "gam-lang bpai"}, "a": {"m": "70b5706d0b", "f": "3f072fcc3e"}}, {"id": "future4", "en": "What are you doing (right now)?", "note": "", "th": {"m": "ทำอะไรอยู่", "f": "ทำอะไรอยู่"}, "ro": {"m": "tham à-rai yùu", "f": "tham à-rai yùu"}, "a": {"m": "52ef32f39e", "f": "0c6bcea6cf"}}, {"id": "future5", "en": "I'm teaching right now.", "note": "", "th": {"m": "ผมกำลังสอนอยู่ครับ", "f": "ฉันกำลังสอนอยู่ค่ะ"}, "ro": {"m": "phǒm gam-lang sǎwn yùu khráp", "f": "chǎn gam-lang sǎwn yùu khâ"}, "a": {"m": "74c1d89f14", "f": "733b8e2a20"}}, {"id": "future6", "en": "I'll call you in a bit.", "note": "", "th": {"m": "เดี๋ยวจะโทรหา", "f": "เดี๋ยวจะโทรหา"}, "ro": {"m": "dǐao jà thoo hǎa", "f": "dǐao jà thoo hǎa"}, "a": {"m": "2ceb84a839", "f": "7e9716466d"}}, {"id": "future7", "en": "Next year I'll go home.", "note": "", "th": {"m": "ปีหน้าผมจะกลับบ้านครับ", "f": "ปีหน้าฉันจะกลับบ้านค่ะ"}, "ro": {"m": "bpii nâa phǒm jà glàp bâan khráp", "f": "bpii nâa chǎn jà glàp bâan khâ"}, "a": {"m": "e9c502e097", "f": "d5eb0d49c6"}}, {"id": "future8", "en": "next week", "note": "", "th": {"m": "อาทิตย์หน้า", "f": "อาทิตย์หน้า"}, "ro": {"m": "aa-thít nâa", "f": "aa-thít nâa"}, "a": {"m": "f782f9efbf", "f": "5605afaf96"}}, {"id": "future9", "en": "next month", "note": "", "th": {"m": "เดือนหน้า", "f": "เดือนหน้า"}, "ro": {"m": "duean nâa", "f": "duean nâa"}, "a": {"m": "4bbf8684f2", "f": "c00d243470"}}, {"id": "future10", "en": "in ten minutes", "note": "", "th": {"m": "อีกสิบนาที", "f": "อีกสิบนาที"}, "ro": {"m": "ìik sìp naa-thii", "f": "ìik sìp naa-thii"}, "a": {"m": "a9cacb5c0a", "f": "21a45c0548"}}, {"id": "future11", "en": "Almost there.", "note": "", "th": {"m": "ใกล้จะถึงแล้ว", "f": "ใกล้จะถึงแล้ว"}, "ro": {"m": "glâi jà thǔeng láew", "f": "glâi jà thǔeng láew"}, "a": {"m": "43441ceb79", "f": "bcbbd033c6"}}, {"id": "future12", "en": "Will it rain?", "note": "", "th": {"m": "จะฝนตกไหม", "f": "จะฝนตกไหม"}, "ro": {"m": "jà fǒn dtòk mǎi", "f": "jà fǒn dtòk mǎi"}, "a": {"m": "0e7694954c", "f": "109ef61f8f"}}, {"id": "future13", "en": "I haven't decided yet.", "note": "", "th": {"m": "ยังไม่ได้ตัดสินใจ", "f": "ยังไม่ได้ตัดสินใจ"}, "ro": {"m": "yang mâi dâai dtàt-sǐn-jai", "f": "yang mâi dâai dtàt-sǐn-jai"}, "a": {"m": "aea7c6d2ea", "f": "8f37c9b388"}}], "dialogue": [{"s": "f", "th": "ทำอะไรอยู่คะ", "ro": "tham à-rai yùu khá", "en": "What are you doing?", "a": "e105951b4f"}, {"s": "m", "th": "กำลังสอนอยู่ครับ อีกสิบนาทีเสร็จ", "ro": "gam-lang sǎwn yùu khráp, ìik sìp naa-thii sèt", "en": "I'm teaching. Done in ten minutes.", "a": "bba82b5703"}, {"s": "f", "th": "เย็นนี้จะไปไหนไหมคะ", "ro": "yen níi jà bpai nǎi mǎi khá", "en": "Are you going anywhere this evening?", "a": "80bc7a790d"}, {"s": "m", "th": "จะไปยิมครับ แล้วคุณล่ะ", "ro": "jà bpai yim khráp, láew khun lâ", "en": "I'm going to the gym. And you?", "a": "e84f5a7b04"}, {"s": "f", "th": "จะกลับบ้านค่ะ เดี๋ยวโทรหานะคะ", "ro": "jà glàp bâan khâ, dǐao thoo hǎa ná khá", "en": "I'm going home. I'll call you later.", "a": "a9093e5d28"}]}, {"id": "want", "title": "Want, need, must, should", "th": "อยาก · ต้อง · ควร", "icon": "link", "goal": "Say what you want, need and have to do.", "level": 3, "how": "อยาก (yàak) + verb = want to. อยากได้ + thing = want (a thing). ต้อง (dtâwng) = must / have to; ไม่ต้อง = don't need to. ควร (khuan) = should.", "phrases": [{"id": "want0", "en": "I want to eat papaya salad.", "note": "", "th": {"m": "ผมอยากกินส้มตำครับ", "f": "ฉันอยากกินส้มตำค่ะ"}, "ro": {"m": "phǒm yàak gin sôm-dtam khráp", "f": "chǎn yàak gin sôm-dtam khâ"}, "a": {"m": "307d116d24", "f": "516d658178"}}, {"id": "want1", "en": "I want this one.", "note": "", "th": {"m": "ผมอยากได้อันนี้ครับ", "f": "ฉันอยากได้อันนี้ค่ะ"}, "ro": {"m": "phǒm yàak dâai an-níi khráp", "f": "chǎn yàak dâai an-níi khâ"}, "a": {"m": "f3ce365f97", "f": "418ece5fbb"}}, {"id": "want2", "en": "Do you want to go?", "note": "", "th": {"m": "อยากไปไหม", "f": "อยากไปไหม"}, "ro": {"m": "yàak bpai mǎi", "f": "yàak bpai mǎi"}, "a": {"m": "a6200ab4f7", "f": "43bb2d00b3"}}, {"id": "want3", "en": "I don't want to go.", "note": "", "th": {"m": "ไม่อยากไป", "f": "ไม่อยากไป"}, "ro": {"m": "mâi yàak bpai", "f": "mâi yàak bpai"}, "a": {"m": "5d02c6eeae", "f": "fce93235f1"}}, {"id": "want4", "en": "I have to go to work.", "note": "", "th": {"m": "ผมต้องไปทำงานครับ", "f": "ฉันต้องไปทำงานค่ะ"}, "ro": {"m": "phǒm dtâwng bpai tham-ngaan khráp", "f": "chǎn dtâwng bpai tham-ngaan khâ"}, "a": {"m": "f31661d598", "f": "5d29af8bcd"}}, {"id": "want5", "en": "Don't worry.", "note": "", "th": {"m": "ไม่ต้องห่วง", "f": "ไม่ต้องห่วง"}, "ro": {"m": "mâi dtâwng hùang", "f": "mâi dtâwng hùang"}, "a": {"m": "1717077a5d", "f": "e0cdbca9f2"}}, {"id": "want6", "en": "No need to hurry.", "note": "", "th": {"m": "ไม่ต้องรีบ", "f": "ไม่ต้องรีบ"}, "ro": {"m": "mâi dtâwng rîip", "f": "mâi dtâwng rîip"}, "a": {"m": "585f12dd17", "f": "e3c838aa5b"}}, {"id": "want7", "en": "Do I need to book first?", "note": "", "th": {"m": "ต้องจองก่อนไหม", "f": "ต้องจองก่อนไหม"}, "ro": {"m": "dtâwng jawng gàwn mǎi", "f": "dtâwng jawng gàwn mǎi"}, "a": {"m": "a315cb57a8", "f": "72f8c4cac0"}}, {"id": "want8", "en": "You should see a doctor.", "note": "", "th": {"m": "ควรไปหาหมอ", "f": "ควรไปหาหมอ"}, "ro": {"m": "khuan bpai hǎa mǎw", "f": "khuan bpai hǎa mǎw"}, "a": {"m": "c3f618191c", "f": "35e7312ded"}}, {"id": "want9", "en": "You shouldn't eat too much.", "note": "", "th": {"m": "ไม่ควรกินเยอะ", "f": "ไม่ควรกินเยอะ"}, "ro": {"m": "mâi khuan gin yóe", "f": "mâi khuan gin yóe"}, "a": {"m": "dfeb33bf91", "f": "6219a88070"}}, {"id": "want10", "en": "What do you need? (formal)", "note": "", "th": {"m": "ต้องการอะไรครับ", "f": "ต้องการอะไรคะ"}, "ro": {"m": "dtâwng-gaan à-rai khráp", "f": "dtâwng-gaan à-rai khá"}, "a": {"m": "3d6182da98", "f": "6bbce9a01e"}}, {"id": "want11", "en": "I need a receipt.", "note": "", "th": {"m": "ผมต้องการใบเสร็จครับ", "f": "ฉันต้องการใบเสร็จค่ะ"}, "ro": {"m": "phǒm dtâwng-gaan bai-sèt khráp", "f": "chǎn dtâwng-gaan bai-sèt khâ"}, "a": {"m": "f4fd86887a", "f": "6983591799"}}, {"id": "want12", "en": "I want to get good at speaking Thai.", "note": "", "th": {"m": "อยากพูดไทยให้เก่ง", "f": "อยากพูดไทยให้เก่ง"}, "ro": {"m": "yàak phûut thai hâi gèng", "f": "yàak phûut thai hâi gèng"}, "a": {"m": "d34f9f94e3", "f": "f93a60dc30"}}], "dialogue": [{"s": "m", "th": "หิวไหมครับ อยากกินอะไร", "ro": "hǐw mǎi khráp, yàak gin à-rai", "en": "Hungry? What do you want to eat?", "a": "e65bcf6830"}, {"s": "f", "th": "อยากกินส้มตำค่ะ แต่ไม่อยากเผ็ดมาก", "ro": "yàak gin sôm-dtam khâ, dtàe mâi yàak phèt mâak", "en": "Papaya salad, but I don't want it too spicy.", "a": "b97109267f"}, {"s": "m", "th": "ร้านนี้ต้องจองก่อนไหมครับ", "ro": "ráan níi dtâwng jawng gàwn mǎi khráp", "en": "Do we need to book this place?", "a": "9f6895fc34"}, {"s": "f", "th": "ไม่ต้องค่ะ ไปเลย", "ro": "mâi dtâwng khâ, bpai loei", "en": "No need. Let's go.", "a": "c3f2c96d78"}, {"s": "m", "th": "แต่ผมต้องกลับไปทำงานบ่ายโมงนะครับ", "ro": "dtàe phǒm dtâwng glàp bpai tham-ngaan bàai moong ná khráp", "en": "But I have to be back at work at 1 p.m.", "a": "569b972f39"}, {"s": "f", "th": "ไม่ต้องห่วงค่ะ ใกล้ๆ นี่เอง", "ro": "mâi dtâwng hùang khâ, glâi-glâi nîi eeng", "en": "Don't worry, it's really close.", "a": "249117b710"}]}, {"id": "can", "title": "Can: ได้, เป็น, ไหว, ออก", "th": "ได้ · เป็น · ไหว", "icon": "link", "goal": "Say what you can and cannot do — four different ways.", "level": 3, "how": "After a verb: ได้ (dâai) = can / allowed; เป็น (bpen) = know how (a learned skill); ไหว (wǎi) = have the strength; ออก (àwk) = can make it out (read, hear). Negative: verb + ไม่ได้ / ไม่เป็น / ไม่ไหว / ไม่ออก.", "phrases": [{"id": "can0", "en": "Can you speak Thai?", "note": "", "th": {"m": "พูดไทยได้ไหม", "f": "พูดไทยได้ไหม"}, "ro": {"m": "phûut thai dâai mǎi", "f": "phûut thai dâai mǎi"}, "a": {"m": "f27dffadf0", "f": "c2c694add5"}}, {"id": "can1", "en": "A little.", "note": "", "th": {"m": "ได้นิดหน่อย", "f": "ได้นิดหน่อย"}, "ro": {"m": "dâai nít-nàwy", "f": "dâai nít-nàwy"}, "a": {"m": "2bf8cf7cd7", "f": "d46be5e884"}}, {"id": "can2", "en": "Can you swim?", "note": "", "th": {"m": "ว่ายน้ำเป็นไหม", "f": "ว่ายน้ำเป็นไหม"}, "ro": {"m": "wâai-náam bpen mǎi", "f": "wâai-náam bpen mǎi"}, "a": {"m": "c698ef0279", "f": "97ccedca7c"}}, {"id": "can3", "en": "I can't swim (never learned).", "note": "", "th": {"m": "ว่ายน้ำไม่เป็น", "f": "ว่ายน้ำไม่เป็น"}, "ro": {"m": "wâai-náam mâi bpen", "f": "wâai-náam mâi bpen"}, "a": {"m": "9dbbc38563", "f": "e89d2deaa7"}}, {"id": "can4", "en": "Can you drive?", "note": "", "th": {"m": "ขับรถเป็นไหม", "f": "ขับรถเป็นไหม"}, "ro": {"m": "khàp rót bpen mǎi", "f": "khàp rót bpen mǎi"}, "a": {"m": "8bb7eb18aa", "f": "1228268ede"}}, {"id": "can5", "en": "Can I go in?", "note": "", "th": {"m": "เข้าไปได้ไหม", "f": "เข้าไปได้ไหม"}, "ro": {"m": "khâo bpai dâai mǎi", "f": "khâo bpai dâai mǎi"}, "a": {"m": "fdf0d2dee7", "f": "0614a65801"}}, {"id": "can6", "en": "May I take a photo?", "note": "", "th": {"m": "ถ่ายรูปได้ไหม", "f": "ถ่ายรูปได้ไหม"}, "ro": {"m": "thàai rûup dâai mǎi", "f": "thàai rûup dâai mǎi"}, "a": {"m": "9b6689b07f", "f": "68fda9a0ae"}}, {"id": "can7", "en": "You can't smoke here.", "note": "", "th": {"m": "ที่นี่สูบบุหรี่ไม่ได้", "f": "ที่นี่สูบบุหรี่ไม่ได้"}, "ro": {"m": "thîi-nîi sùup bù-rìi mâi dâai", "f": "thîi-nîi sùup bù-rìi mâi dâai"}, "a": {"m": "a71f992b91", "f": "15bc849707"}}, {"id": "can8", "en": "I can't take it anymore.", "note": "", "th": {"m": "ไม่ไหวแล้ว", "f": "ไม่ไหวแล้ว"}, "ro": {"m": "mâi wǎi láew", "f": "mâi wǎi láew"}, "a": {"m": "1d52b55224", "f": "c27d17d16a"}}, {"id": "can9", "en": "Can you manage to walk?", "note": "", "th": {"m": "เดินไหวไหม", "f": "เดินไหวไหม"}, "ro": {"m": "doen wǎi mǎi", "f": "doen wǎi mǎi"}, "a": {"m": "2dfa2073dd", "f": "0452150cd4"}}, {"id": "can10", "en": "Can you read Thai?", "note": "", "th": {"m": "อ่านภาษาไทยออกไหม", "f": "อ่านภาษาไทยออกไหม"}, "ro": {"m": "àan phaa-sǎa thai àwk mǎi", "f": "àan phaa-sǎa thai àwk mǎi"}, "a": {"m": "739cc45a48", "f": "4d6a224802"}}, {"id": "can11", "en": "I can read a little.", "note": "", "th": {"m": "อ่านออกนิดหน่อย", "f": "อ่านออกนิดหน่อย"}, "ro": {"m": "àan àwk nít-nàwy", "f": "àan àwk nít-nàwy"}, "a": {"m": "8548ca4192", "f": "dd90d1667d"}}, {"id": "can12", "en": "I can't make out what's being said.", "note": "", "th": {"m": "ฟังไม่ออก", "f": "ฟังไม่ออก"}, "ro": {"m": "fang mâi àwk", "f": "fang mâi àwk"}, "a": {"m": "399ab13ba5", "f": "ee2b2d2275"}}], "dialogue": [{"s": "f", "th": "ว่ายน้ำเป็นไหมคะ", "ro": "wâai-náam bpen mǎi khá", "en": "Can you swim?", "a": "7afde7dfa5"}, {"s": "m", "th": "เป็นครับ แต่ไม่เก่ง", "ro": "bpen khráp, dtàe mâi gèng", "en": "Yes, but I'm not good.", "a": "1392325a68"}, {"s": "f", "th": "พรุ่งนี้ไปว่ายน้ำด้วยกันได้ไหมคะ", "ro": "phrûng-níi bpai wâai-náam dûay-gan dâai mǎi khá", "en": "Can we go swimming together tomorrow?", "a": "535221d41b"}, {"s": "m", "th": "ได้ครับ แต่ผมว่ายได้แค่ห้ารอบนะ", "ro": "dâai khráp, dtàe phǒm wâai dâai khâe hâa râwp ná", "en": "Sure, but I can only swim five laps.", "a": "e3f7b5122d"}, {"s": "f", "th": "ไม่เป็นไรค่ะ ไหวแค่ไหนก็แค่นั้น", "ro": "mâi bpen rai khâ, wǎi khâe nǎi gâw khâe nán", "en": "No problem — as much as you can manage.", "a": "5b0fbd1a86"}]}, {"id": "compare", "title": "Comparing: more, most, same", "th": "กว่า · ที่สุด", "icon": "link", "goal": "Compare prices, places and people.", "level": 3, "how": "Adjective + กว่า (gwàa) = more …; + ที่สุด (thîi-sùt) = the most …; เหมือน (mǔean) = like / the same as; เท่ากัน (thâo gan) = equal.", "phrases": [{"id": "compare0", "en": "This one is cheaper.", "note": "", "th": {"m": "อันนี้ถูกกว่า", "f": "อันนี้ถูกกว่า"}, "ro": {"m": "an-níi thùuk gwàa", "f": "an-níi thùuk gwàa"}, "a": {"m": "3fde4c21bb", "f": "d3597cce44"}}, {"id": "compare1", "en": "Which one is better?", "note": "", "th": {"m": "อันไหนดีกว่า", "f": "อันไหนดีกว่า"}, "ro": {"m": "an nǎi dii gwàa", "f": "an nǎi dii gwàa"}, "a": {"m": "51e666ae25", "f": "50f36a80e5"}}, {"id": "compare2", "en": "This shop is the most delicious.", "note": "", "th": {"m": "ร้านนี้อร่อยที่สุด", "f": "ร้านนี้อร่อยที่สุด"}, "ro": {"m": "ráan níi à-ròi thîi-sùt", "f": "ráan níi à-ròi thîi-sùt"}, "a": {"m": "de278c22c6", "f": "f495cc20b8"}}, {"id": "compare3", "en": "He / she is taller than me.", "note": "", "th": {"m": "เขาสูงกว่าผม", "f": "เขาสูงกว่าฉัน"}, "ro": {"m": "kháo sǔung gwàa phǒm", "f": "kháo sǔung gwàa chǎn"}, "a": {"m": "fef59f64a9", "f": "424a2bf681"}}, {"id": "compare4", "en": "Bangkok is hotter than Chiang Mai.", "note": "", "th": {"m": "กรุงเทพร้อนกว่าเชียงใหม่", "f": "กรุงเทพร้อนกว่าเชียงใหม่"}, "ro": {"m": "grung-thêep ráwn gwàa chiang-mài", "f": "grung-thêep ráwn gwàa chiang-mài"}, "a": {"m": "bb61cada2c", "f": "7c94efd061"}}, {"id": "compare5", "en": "The same. / Me too.", "note": "", "th": {"m": "เหมือนกัน", "f": "เหมือนกัน"}, "ro": {"m": "mǔean gan", "f": "mǔean gan"}, "a": {"m": "a560bf7c48", "f": "68cf904436"}}, {"id": "compare6", "en": "Not the same.", "note": "", "th": {"m": "ไม่เหมือนกัน", "f": "ไม่เหมือนกัน"}, "ro": {"m": "mâi mǔean gan", "f": "mâi mǔean gan"}, "a": {"m": "51e0ae1eb1", "f": "dc795d6415"}}, {"id": "compare7", "en": "equal / the same amount", "note": "", "th": {"m": "เท่ากัน", "f": "เท่ากัน"}, "ro": {"m": "thâo gan", "f": "thâo gan"}, "a": {"m": "0d0c568142", "f": "393c9006a0"}}, {"id": "compare8", "en": "Do you have a cheaper one?", "note": "", "th": {"m": "ถูกกว่านี้มีไหม", "f": "ถูกกว่านี้มีไหม"}, "ro": {"m": "thùuk gwàa níi mii mǎi", "f": "thùuk gwàa níi mii mǎi"}, "a": {"m": "944d1df701", "f": "44074084f4"}}, {"id": "compare9", "en": "the biggest", "note": "", "th": {"m": "ใหญ่ที่สุด", "f": "ใหญ่ที่สุด"}, "ro": {"m": "yài thîi-sùt", "f": "yài thîi-sùt"}, "a": {"m": "1f45f22199", "f": "e182fe3cf7"}}, {"id": "compare10", "en": "Which one do you like more?", "note": "", "th": {"m": "ชอบอันไหนมากกว่า", "f": "ชอบอันไหนมากกว่า"}, "ro": {"m": "chôop an nǎi mâak gwàa", "f": "chôop an nǎi mâak gwàa"}, "a": {"m": "b3dbdb549c", "f": "602a3fc067"}}, {"id": "compare11", "en": "The best!", "note": "", "th": {"m": "ดีที่สุดเลย", "f": "ดีที่สุดเลย"}, "ro": {"m": "dii thîi-sùt loei", "f": "dii thîi-sùt loei"}, "a": {"m": "42bddd094b", "f": "aacfc4081d"}}, {"id": "compare12", "en": "less than", "note": "", "th": {"m": "น้อยกว่า", "f": "น้อยกว่า"}, "ro": {"m": "náwy gwàa", "f": "náwy gwàa"}, "a": {"m": "b9234bf7b9", "f": "40338d1ee5"}}], "dialogue": [{"s": "m", "th": "ระหว่างอันนี้กับอันนั้น อันไหนดีกว่าครับ", "ro": "rá-wàang an-níi gàp an-nán, an nǎi dii gwàa khráp", "en": "Between this one and that one, which is better?", "a": "d4afa2e701"}, {"s": "f", "th": "อันนี้ดีกว่าค่ะ แต่แพงกว่านิดหน่อย", "ro": "an-níi dii gwàa khâ, dtàe phaeng gwàa nít-nàwy", "en": "This one is better, but a bit more expensive.", "a": "3cde72d984"}, {"s": "m", "th": "ถูกกว่านี้มีไหมครับ", "ro": "thùuk gwàa níi mii mǎi khráp", "en": "Do you have a cheaper one?", "a": "dab0f4facc"}, {"s": "f", "th": "มีค่ะ อันนี้ถูกที่สุด แต่คุณภาพไม่เหมือนกันนะคะ", "ro": "mii khâ, an-níi thùuk thîi-sùt, dtàe khun-ná-phâap mâi mǔean gan ná khá", "en": "Yes, this is the cheapest, but the quality isn't the same.", "a": "75f4ebe302"}, {"s": "m", "th": "งั้นเอาอันแรกครับ", "ro": "ngán ao an râek khráp", "en": "Then I'll take the first one.", "a": "40f5f62f8a"}]}, {"id": "because", "title": "Because, so, if, but", "th": "เพราะ · ถ้า", "icon": "link", "goal": "Give reasons and make conditions.", "level": 3, "how": "เพราะ (phráw) = because. เลย / ก็เลย (gâw loei) = so. ถ้า (thâa) … ก็ … = if … then. แต่ (dtàe) = but. ทำไม (tham-mai) = why. งั้น (ngán) = in that case.", "phrases": [{"id": "because0", "en": "Why are you late?", "note": "", "th": {"m": "ทำไมมาสาย", "f": "ทำไมมาสาย"}, "ro": {"m": "tham-mai maa sǎai", "f": "tham-mai maa sǎai"}, "a": {"m": "f38e510d70", "f": "8b7516d582"}}, {"id": "because1", "en": "Because of the traffic.", "note": "", "th": {"m": "เพราะรถติด", "f": "เพราะรถติด"}, "ro": {"m": "phráw rót dtìt", "f": "phráw rót dtìt"}, "a": {"m": "e586ba4126", "f": "404f1091f5"}}, {"id": "because2", "en": "It rained, so I didn't go.", "note": "", "th": {"m": "ฝนตกเลยไม่ได้ไป", "f": "ฝนตกเลยไม่ได้ไป"}, "ro": {"m": "fǒn dtòk loei mâi dâai bpai", "f": "fǒn dtòk loei mâi dâai bpai"}, "a": {"m": "0ede986157", "f": "1df66f3fe4"}}, {"id": "because3", "en": "If you're free, come over.", "note": "", "th": {"m": "ถ้าว่างก็มานะ", "f": "ถ้าว่างก็มานะ"}, "ro": {"m": "thâa wâang gâw maa ná", "f": "thâa wâang gâw maa ná"}, "a": {"m": "d2509f741c", "f": "3750e3d3db"}}, {"id": "because4", "en": "If you can't manage, tell me.", "note": "", "th": {"m": "ถ้าไม่ไหวบอกนะ", "f": "ถ้าไม่ไหวบอกนะ"}, "ro": {"m": "thâa mâi wǎi bàwk ná", "f": "thâa mâi wǎi bàwk ná"}, "a": {"m": "476641b6de", "f": "8ca5ee0991"}}, {"id": "because5", "en": "I like it, but it's too expensive.", "note": "", "th": {"m": "ชอบ แต่แพงไป", "f": "ชอบ แต่แพงไป"}, "ro": {"m": "chôop, dtàe phaeng bpai", "f": "chôop, dtàe phaeng bpai"}, "a": {"m": "dbb61a52d9", "f": "54a34dc58e"}}, {"id": "because6", "en": "Why's that?", "note": "", "th": {"m": "ทำไมล่ะ", "f": "ทำไมล่ะ"}, "ro": {"m": "tham-mai lâ", "f": "tham-mai lâ"}, "a": {"m": "7955ce2c26", "f": "fc122f9bcc"}}, {"id": "because7", "en": "I was sick, so I didn't go to work.", "note": "", "th": {"m": "ผมไม่สบายก็เลยไม่ได้ไปทำงานครับ", "f": "ฉันไม่สบายก็เลยไม่ได้ไปทำงานค่ะ"}, "ro": {"m": "phǒm mâi sà-baai gâw loei mâi dâai bpai tham-ngaan khráp", "f": "chǎn mâi sà-baai gâw loei mâi dâai bpai tham-ngaan khâ"}, "a": {"m": "5f855b4c32", "f": "c740a93360"}}, {"id": "because8", "en": "if I have time", "note": "", "th": {"m": "ถ้ามีเวลา", "f": "ถ้ามีเวลา"}, "ro": {"m": "thâa mii wee-laa", "f": "thâa mii wee-laa"}, "a": {"m": "7f1e5deb25", "f": "8c7a348f60"}}, {"id": "because9", "en": "therefore", "note": "", "th": {"m": "เพราะฉะนั้น", "f": "เพราะฉะนั้น"}, "ro": {"m": "phráw-chà-nán", "f": "phráw-chà-nán"}, "a": {"m": "ba6433b58a", "f": "ad8ecfc0ec"}}, {"id": "because10", "en": "otherwise", "note": "", "th": {"m": "ไม่งั้น", "f": "ไม่งั้น"}, "ro": {"m": "mâi ngán", "f": "mâi ngán"}, "a": {"m": "444f795b4d", "f": "dfd4aebf17"}}, {"id": "because11", "en": "Either way is fine.", "note": "", "th": {"m": "ยังไงก็ได้", "f": "ยังไงก็ได้"}, "ro": {"m": "yang-ngai gâw dâai", "f": "yang-ngai gâw dâai"}, "a": {"m": "07888358b1", "f": "185fb6b709"}}, {"id": "because12", "en": "OK then, in that case.", "note": "", "th": {"m": "งั้นก็ได้", "f": "งั้นก็ได้"}, "ro": {"m": "ngán gâw dâai", "f": "ngán gâw dâai"}, "a": {"m": "ce1c8bfea3", "f": "0843e46d81"}}], "dialogue": [{"s": "f", "th": "ทำไมมาสายคะ", "ro": "tham-mai maa sǎai khá", "en": "Why are you late?", "a": "e3c2d10a92"}, {"s": "m", "th": "ขอโทษครับ เพราะรถติดมาก", "ro": "khǎw-thôot khráp, phráw rót dtìt mâak", "en": "Sorry, the traffic was terrible.", "a": "85d96dffb3"}, {"s": "f", "th": "ถ้ารถติดก็นั่งรถไฟฟ้าสิคะ", "ro": "thâa rót dtìt gâw nâng rót-fai-fáa sì khá", "en": "If there is traffic, take the BTS!", "a": "bcd30cd42d"}, {"s": "m", "th": "แต่แถวบ้านผมไม่มีรถไฟฟ้าครับ ก็เลยต้องนั่งแท็กซี่", "ro": "dtàe thǎeo bâan phǒm mâi mii rót-fai-fáa khráp, gâw loei dtâwng nâng tháek-sîi", "en": "But there's no BTS near my home, so I have to take a taxi.", "a": "c87f4fb35b"}, {"s": "f", "th": "งั้นออกจากบ้านเร็วขึ้นนะคะ", "ro": "ngán àwk jàak bâan reo khûen ná khá", "en": "Then leave home earlier.", "a": "f694ffb3a7"}]}, {"id": "opinion", "title": "Opinions & guesses", "th": "คิดว่า", "icon": "link", "goal": "Give your opinion, agree, disagree and guess.", "level": 3, "how": "คิดว่า (khít wâa) = I think that. ว่า (wâa) introduces what is said or thought: เขาบอกว่า… = he said that… น่าจะ (nâa-jà) = probably. มั้ง (máng) at the end = I guess.", "phrases": [{"id": "opinion0", "en": "What do you think?", "note": "", "th": {"m": "คิดว่ายังไง", "f": "คิดว่ายังไง"}, "ro": {"m": "khít wâa yang-ngai", "f": "khít wâa yang-ngai"}, "a": {"m": "322faa1367", "f": "02d225ccf2"}}, {"id": "opinion1", "en": "I think it's good.", "note": "", "th": {"m": "ผมคิดว่าดีครับ", "f": "ฉันคิดว่าดีค่ะ"}, "ro": {"m": "phǒm khít wâa dii khráp", "f": "chǎn khít wâa dii khâ"}, "a": {"m": "d93e883213", "f": "66d1fb6e6b"}}, {"id": "opinion2", "en": "I don't think so.", "note": "", "th": {"m": "ผมไม่คิดอย่างนั้นครับ", "f": "ฉันไม่คิดอย่างนั้นค่ะ"}, "ro": {"m": "phǒm mâi khít yàang-nán khráp", "f": "chǎn mâi khít yàang-nán khâ"}, "a": {"m": "76f24fb416", "f": "03d89f3ed6"}}, {"id": "opinion3", "en": "Probably, yes.", "note": "", "th": {"m": "น่าจะใช่", "f": "น่าจะใช่"}, "ro": {"m": "nâa-jà châi", "f": "nâa-jà châi"}, "a": {"m": "172ce0ec6a", "f": "4669c80426"}}, {"id": "opinion4", "en": "Probably not coming.", "note": "", "th": {"m": "น่าจะไม่มา", "f": "น่าจะไม่มา"}, "ro": {"m": "nâa-jà mâi maa", "f": "nâa-jà mâi maa"}, "a": {"m": "8181faad28", "f": "5405795fc7"}}, {"id": "opinion5", "en": "I'm not sure.", "note": "", "th": {"m": "ไม่แน่ใจ", "f": "ไม่แน่ใจ"}, "ro": {"m": "mâi nâe-jai", "f": "mâi nâe-jai"}, "a": {"m": "319bb64977", "f": "c1b3f28b82"}}, {"id": "opinion6", "en": "actually", "note": "", "th": {"m": "จริงๆ แล้ว", "f": "จริงๆ แล้ว"}, "ro": {"m": "jing-jing láew", "f": "jing-jing láew"}, "a": {"m": "e6bf3689c2", "f": "286f310968"}}, {"id": "opinion7", "en": "He / she said they would come.", "note": "", "th": {"m": "เขาบอกว่าจะมา", "f": "เขาบอกว่าจะมา"}, "ro": {"m": "kháo bàwk wâa jà maa", "f": "kháo bàwk wâa jà maa"}, "a": {"m": "a2daeee675", "f": "70748c11ee"}}, {"id": "opinion8", "en": "I agree.", "note": "", "th": {"m": "เห็นด้วย", "f": "เห็นด้วย"}, "ro": {"m": "hěn dûay", "f": "hěn dûay"}, "a": {"m": "fc1261ddbc", "f": "7b3827c8bc"}}, {"id": "opinion9", "en": "I disagree.", "note": "", "th": {"m": "ไม่เห็นด้วย", "f": "ไม่เห็นด้วย"}, "ro": {"m": "mâi hěn dûay", "f": "mâi hěn dûay"}, "a": {"m": "0d835a9021", "f": "58c360ece0"}}, {"id": "opinion10", "en": "It's up to you.", "note": "", "th": {"m": "แล้วแต่คุณ", "f": "แล้วแต่คุณ"}, "ro": {"m": "láew-dtàe khun", "f": "láew-dtàe khun"}, "a": {"m": "25e13caffe", "f": "1665506c9e"}}, {"id": "opinion11", "en": "OK, fine.", "note": "", "th": {"m": "ก็ได้", "f": "ก็ได้"}, "ro": {"m": "gâw dâai", "f": "gâw dâai"}, "a": {"m": "1d1eda1f0c", "f": "6939edf04c"}}, {"id": "opinion12", "en": "It's fun, I guess.", "note": "", "th": {"m": "สนุกมั้ง", "f": "สนุกมั้ง"}, "ro": {"m": "sà-nùk máng", "f": "sà-nùk máng"}, "a": {"m": "8d367c19b6", "f": "f35e468da7"}}, {"id": "opinion13", "en": "That's impossible.", "note": "", "th": {"m": "เป็นไปไม่ได้", "f": "เป็นไปไม่ได้"}, "ro": {"m": "bpen bpai mâi dâai", "f": "bpen bpai mâi dâai"}, "a": {"m": "db220de0d7", "f": "8df274446e"}}], "dialogue": [{"s": "m", "th": "คุณคิดว่าครูใหม่เป็นยังไงครับ", "ro": "khun khít wâa khruu mài bpen yang-ngai khráp", "en": "What do you think of the new teacher?", "a": "07724256b5"}, {"s": "f", "th": "ฉันคิดว่าใจดีค่ะ แต่ยังไม่แน่ใจ", "ro": "chǎn khít wâa jai-dii khâ, dtàe yang mâi nâe-jai", "en": "I think she's kind, but I'm not sure yet.", "a": "0d035a8263"}, {"s": "m", "th": "เขาบอกว่าจะอยู่ปีเดียวนะครับ", "ro": "kháo bàwk wâa jà yùu bpii diao ná khráp", "en": "She said she'll only stay one year.", "a": "19dccf878f"}, {"s": "f", "th": "จริงเหรอคะ น่าเสียดายนะ", "ro": "jing rǒe khá, nâa sǐa-daai ná", "en": "Really? That's a pity.", "a": "9ce8def7d4"}, {"s": "m", "th": "เห็นด้วยครับ", "ro": "hěn dûay khráp", "en": "I agree.", "a": "17a8268470"}]}, {"id": "particles", "title": "Little words: นะ สิ หน่อย เลย", "th": "คำลงท้าย", "icon": "link", "goal": "Sound natural — the little words make Thai friendly.", "level": 3, "how": "Ending words carry the feeling. นะ (ná) softens or asks for agreement; สิ (sì) = go on, do it; หน่อย (nàwy) = please / a little; เลย (loei) = totally / right away; จัง (jang) = so (strong feeling); ล่ะ (lâ) = and what about…; เหรอ (rǒe) = really?; เถอะ (thòe) = let's.", "phrases": [{"id": "particles0", "en": "Wait a moment, OK?", "note": "", "th": {"m": "รอก่อนนะ", "f": "รอก่อนนะ"}, "ro": {"m": "raw gàwn ná", "f": "raw gàwn ná"}, "a": {"m": "d87d1fd95e", "f": "fcc6640bb3"}}, {"id": "particles1", "en": "Go ahead, eat!", "note": "", "th": {"m": "กินสิ", "f": "กินสิ"}, "ro": {"m": "gin sì", "f": "gin sì"}, "a": {"m": "416f16d956", "f": "3f3e191553"}}, {"id": "particles2", "en": "Help me a bit, please.", "note": "", "th": {"m": "ช่วยหน่อย", "f": "ช่วยหน่อย"}, "ro": {"m": "chûay nàwy", "f": "chûay nàwy"}, "a": {"m": "6de7a86708", "f": "a4ed39cc76"}}, {"id": "particles3", "en": "Let's go now. / Go ahead.", "note": "", "th": {"m": "ไปเลย", "f": "ไปเลย"}, "ro": {"m": "bpai loei", "f": "bpai loei"}, "a": {"m": "931e656096", "f": "70d149ae5e"}}, {"id": "particles4", "en": "Really great!", "note": "", "th": {"m": "ดีมากเลย", "f": "ดีมากเลย"}, "ro": {"m": "dii mâak loei", "f": "dii mâak loei"}, "a": {"m": "9f4e154be1", "f": "906e920ff8"}}, {"id": "particles5", "en": "So cute!", "note": "", "th": {"m": "น่ารักจัง", "f": "น่ารักจัง"}, "ro": {"m": "nâa-rák jang", "f": "nâa-rák jang"}, "a": {"m": /* ---------------- state ---------------- */

}

/* spaced review boxes: 0..5 */

  if (ok) { it.b = Math.min(5, it.b + 1); it.r++; } else { it.b = Math.max(0, it.b - 2); it.w++; }
  it.due = dayNum() + GAP[it.b]; save();

function loadPack(n) {

    const sc = document.createElement('script'); sc.src = 'audio/' + D.packs[n];

    document.head.appendChild(sc);

}
function packsFor(keys) { const s = new Set(); keys.forEach(k => { if (k && !AUD[k] && D.packOf[k]) s.add(D.packOf[k]); }); return [...s]; }

  names.forEach(n => { if (!D.packs[n]) packLoad[n + '_ok'] = 1; });   // nothing to load = ready
  const todo = names.filter(n => !packLoad[n + '_ok']);
  if (!todo.length) return fn();
  app.innerHTML = '<div class="center muted" style="padding-top:30vh">Loading sounds…</div>';
  Promise.all(todo.map(n => loadPack(n).then(() => { packLoad[n + '_ok'] = 1; })))
    .then(fn).catch(() => { app.innerHTML = `<div class="card" style="margin-top:20vh"><b>Could not load the sounds.</b><div class="en">Open the app once with internet so it can save every lesson for offline use.</div></div><button class="big" id="rt">Try again</button>`; $('#rt').onclick = () => ensure(names, fn); });
}

  if (!k || !AUD[k]) { if (opts.end) opts.end(); return; }

  'network': 'Speech checking needs internet. Offline, use record-and-compare.',

/* mic widget: tries speech checking, falls back to record & compare.  cb({ok, sc, heard, self}) */
function micBlock(target, modelKey, cb) {
  const id = 'mic' + Math.random().toString(36).slice(2, 7);
  const useRec = S.micMode === 'record' || !SR;
  setTimeout(() => {
    const box = document.getElementById(id); if (!box) return;
    const btn = box.querySelector('.micbtn'), tip = box.querySelector('small'), out = box.querySelector('.res');
    let busy = false;
    btn.onclick = async () => {
      if (busy) { if (recActive) { try { recActive.stop(); } catch (e) {} } recordStop(); return; }
      busy = true; btn.classList.add('on'); btn.innerHTML = ic('stop');
      if (!useRec && S.micMode !== 'record') {
        tip.textContent = 'Listening… say it now';
        const r = await recognise(target);
        busy = false; btn.classList.remove('on'); btn.innerHTML = ic('mic');
        if (r.err) {
          tip.textContent = ERRTXT[r.err] || ('Could not check speech (' + r.err + ').');
          if (/not-allowed|service|unsupported|network|language/.test(r.err)) { S.micMode = 'record'; save(); setTimeout(() => { const nb = micBlock(target, modelKey, cb); box.outerHTML = nb; }, 1600); }
          return;
        }
        const sc = r.sc;
        out.innerHTML = `<div class="heard">I heard: <span class="th">${esc(r.heard || '…')}</span></div>`;
        tip.textContent = sc >= 0.8 ? 'Great!' : sc >= 0.55 ? 'Close — listen again and try once more.' : 'Not quite — listen again and try once more.';
        cb({ ok: sc >= 0.55, sc, heard: r.heard });
      } else {
        try {
          tip.textContent = 'Recording… tap again to stop';
          const t = setTimeout(recordStop, 7000);
          const u = await recordStart(); clearTimeout(t);
          busy = false; btn.classList.remove('on'); btn.innerHTML = ic('mic');
          tip.textContent = 'Compare: play yours, then the model. Same tones?';
          out.innerHTML = `<div class="row" style="margin-bottom:12px"><button class="big ghost" data-m>${ic('play')} Mine</button><button class="big ghost" data-o>${ic('play')} Model</button></div>
            <div class="row"><button class="big ghost" data-no>${ic('redo')} Not yet</button><button class="big" data-yes>${ic('check')} Sounds the same</button></div>`;
          out.querySelector('[data-m]').onclick = e => playMine(e.currentTarget);
          out.querySelector('[data-o]').onclick = e => say(modelKey, { btn: e.currentTarget });
          out.querySelector('[data-yes]').onclick = () => cb({ ok: true, sc: 0.8, self: true });
          out.querySelector('[data-no]').onclick = () => cb({ ok: false, sc: 0.3, self: true });
          playMine();
          onEnd = () => say(modelKey);
          audio.onended = null;
        } catch (e) {
          busy = false; btn.classList.remove('on'); btn.innerHTML = ic('mic');
          tip.textContent = 'Microphone not available: ' + (e && e.name === 'NotAllowedError' ? 'permission was refused. On iPad: Settings › Safari › Microphone › Allow.' : (e && e.message || e));
        }
      }
    };
  }, 30);
  return `<div class="mic" id="${id}"><button class="micbtn" aria-label="Speak">${ic('mic')}</button>
    <small>${useRec ? 'Tap, say it, tap again. Then compare with the model.' : 'Tap the mic and say it in Thai'}</small><div class="res" style="width:100%"></div></div>`;
}

/* ---------------- TEST OUT: listening check over one unit or a whole level ---------------- */
function testOut(units, label) {
  ensure(units.map(u => u.id), () => {
    const all = [].concat(...units.map(u => u.phrases));
    const n = units.length > 1 ? Math.min(20, Math.max(14, units.length * 2)) : 10;
    const qs = [];
    const types = ['hear-mean', 'which-says', 'tiles', 'hear-mean'];
    pick(all, n).forEach((p, k) => qs.push({ t: (types[k % 4] === 'tiles' && roOf(p).split(' ').length < 2) ? 'hear-mean' : types[k % 4], p, pool: all }));
    practice({ title: label }, {
      qs, pool: all, back: () => go(home), noRequeue: true,
      onEnd: (stars, xp, pct) => {
        const pass = pct >= 0.8;
        if (pass) units.forEach(u => {
          ['learn', 'practice', 'talk'].forEach(k => mark(u.id, k, k === 'practice' ? 2 : 1));
          u.phrases.forEach(p => { if (!S.items[p.id]) S.items[p.id] = { b: 3, due: dayNum() + 4, r: 1, w: 0 }; });
          save();
        });
        finish(null, pass ? `${label}: passed with ${Math.round(pct * 100)}%` : `${Math.round(pct * 100)}% — you need 80% to skip`, xp, stars, null,
          pass ? 'Those units are marked done. Their phrases will still come up in Daily review.' : 'No problem — work through the units; you will fly through them.');
      },
    });
  });
}

      });
    }
    function end() {

/* ---------------- REAL TALK: longer real-life conversations ---------------- */
function convo(c) {
  const me = g(), T = l => l.th[me], R = l => l.ro[me], AU = l => l.a[me];
  function bubbles(upto, revealAll) {
    return c.lines.slice(0, upto).map((l, i) => {
      const mine = l.w === 'Y', hide = !revealAll && !mine && !S.ctShow;
      return `<div class="msg ${mine ? 'me' : ''} ${hide ? 'hide' : ''}" data-i="${i}"><div class="who">${mine ? 'You' : 'Them'}</div>${S.showTh ? `<div class="th">${esc(T(l))}</div>` : ''}${S.showRo ? `<div class="ro">${esc(R(l))}</div>` : ''}${hide ? '' : `<div class="en">${esc(l.en)}</div>`}</div>`;
    }).join('');
  }
  function intro() {
    app.innerHTML = `<button class="back" id="bk">${ic('back')} Real talk</button>
      <div class="uhead"><div class="th">${esc(c.th)}</div><h2>${esc(c.title)}</h2><p>${esc(c.scene)}</p></div>
      <div class="about"><b>How it works:</b> listen to the whole conversation first. Then have it yourself: the other person speaks, you choose what to say, and you say it out loud in Thai.</div>
      <button class="big" id="pa">${ic('play')} Listen to the whole conversation</button><div style="height:10px"></div>
      <button class="big ghost" id="go">${ic('mic')} Have the conversation</button>
      <div class="chat" id="chat" style="margin-top:16px">${bubbles(c.lines.length, true)}</div><div class="spacer"></div>`;
    $('#bk').onclick = () => { S.tab = 'talk'; save(); go(home); };
    $('#go').onclick = () => { stopAudio(); play(0); };
    const hl = i => app.querySelectorAll('.msg').forEach(m => m.classList.toggle('now', +m.dataset.i === i));
    const all = i => { if (i >= c.lines.length) return hl(-1); hl(i); const m = app.querySelector(`.msg[data-i="${i}"]`); if (m) m.scrollIntoView({ block: 'center', behavior: 'smooth' }); say(AU(c.lines[i]), { end: () => all(i + 1) }); };
    $('#pa').onclick = () => all(0);
    app.querySelectorAll('.msg').forEach(m => m.onclick = () => say(AU(c.lines[+m.dataset.i])));
  }
  let firstPick = 0, spoken = 0;
  const mine = c.lines.filter(l => l.w === 'Y').length;
  function play(i) {
    clearSheets();
    if (i >= c.lines.length) return end();
    const l = c.lines[i];
    app.innerHTML = `<div class="bar"><button class="x" id="qx">${ic('x')}</button><div class="prog"><i style="transform:scaleX(${Math.max(.03, i / c.lines.length)})"></i></div></div>
      <div class="chat" id="chat">${bubbles(i, false)}</div><div id="turn"></div><div class="spacer"></div>`;
    $('#qx').onclick = () => go(() => convo(c));
    app.querySelectorAll('.msg').forEach(m => m.onclick = () => say(AU(c.lines[+m.dataset.i])));
    const turn = $('#turn');
    const scroll = () => setTimeout(() => turn.scrollIntoView({ block: 'end', behavior: 'smooth' }), 60);
    if (l.w === 'A') {
      const nextIsThem = i + 1 < c.lines.length && c.lines[i + 1].w === 'A';
      turn.innerHTML = `<div class="msg now ${S.ctShow ? '' : 'hide'}" style="margin-bottom:12px"><div class="who">Them</div>${S.showTh ? `<div class="th">${esc(T(l))}</div>` : ''}${S.showRo ? `<div class="ro">${esc(R(l))}</div>` : ''}</div>
        <div class="row" style="margin-bottom:10px"><button class="big ghost" id="ag">${ic('play')} Again</button><button class="big ghost" id="sl">${ic('slow')} Slowly</button></div>
        <button class="big ghost" id="sh">${ic('eye')} ${S.ctShow ? 'Hide' : 'Show'} their words</button><div style="height:10px"></div>
        <button class="big" id="nx">${ic('next')} ${nextIsThem || i + 1 >= c.lines.length ? 'Continue' : 'My turn'}</button>`;
      const bub = turn.querySelector('.msg');
      $('#ag').onclick = e => say(AU(l), { btn: e.currentTarget });
      $('#sl').onclick = e => say(AU(l), { slow: true, btn: e.currentTarget });
      $('#sh').onclick = () => { S.ctShow = !S.ctShow; save(); bub.classList.toggle('hide', !S.ctShow); $('#sh').innerHTML = `${ic('eye')} ${S.ctShow ? 'Hide' : 'Show'} their words`; };
      $('#nx').onclick = () => play(i + 1);
      say(AU(l)); scroll();
      return;
    }

      ${i > 0 ? `<button class="big ghost" id="ag">${ic('play')} Hear them again</button>` : ''}`;
    const ag = $('#ag'); if (ag) ag.onclick = e => say(AU(c.lines[i - 1]), { btn: e.currentTarget });
    turn.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const o = opts[+b.dataset.k];

      if (!tries) firstPick++;
      b.classList.add('good');
      speakIt();
    });
    function speakIt() {
      let att = 0;
      turn.innerHTML = `<div class="msg me now" style="margin:0 0 12px auto"><div class="who">You say</div><div class="th">${esc(T(l))}</div><div class="ro">${esc(R(l))}</div><div class="en">${esc(l.en)}</div></div>

      $('#sk').onclick = () => play(i + 1);
      scroll();
    }
    scroll();
  }
  function end() {
    const pct = (firstPick + spoken) / Math.max(1, mine * 2);
    const stars = pct >= .85 ? 3 : pct >= .55 ? 2 : 1;
    mark(c.id, 'talk', stars); addXp(15);
    finish(null, `Conversation done — ${firstPick} of ${mine} replies right first time`, 15, stars, () => convo(c), 'Tap “Keep going” to see the whole conversation again, or have it once more.');
  }
  intro();
}

        done(ok, `${info} — <b>${TONE[tt].name}</b> tone`);
      });
    } else {                                     // spell: hear it, build it from letter tiles (writing practice)
      const chars = Array.from(w.th);
      const pool = [...new Set([].concat(...others.map(x => Array.from(x.th))).filter(c => !chars.includes(c)))];
      const bag = shuffle(chars.map((c, k) => ({ c, k })).concat(pick(pool, Math.min(3, pool.length)).map((c, k) => ({ c, k: 100 + k }))));
      const chosen = [];
      frame(i / qs.length, `<div class="q">Hear it — spell it</div><div class="prompt">Tap the letters in writing order</div>${playRow(w.a, null, true)}

        <div class="slot th" id="slot" style="font-size:40px;justify-content:center;font-family:var(--th)"></div>

        <div class="row"><button class="big ghost" id="undo">${ic('redo')} Undo</button><button class="big" id="chk" disabled>Check</button></div>
        <p class="muted center" style="font-size:14px">Tip: vowels like เ แ โ ไ ใ are written <b>before</b> the consonant. Marks like ◌่ ◌้ go after the letter they sit on.</p>`, back);

/* ---------------- PRACTICE ---------------- */
function buildQs(phrases, pool, n) {
  const qs = [];
  const types = ['hear-mean', 'hear-mean', 'which-says', 'tiles', 'speak', 'shadow'];
  const list = shuffle(phrases);
  for (let k = 0; k < n; k++) {
    const p = list[k % list.length];
    let t = types[k % types.length];
    if (t === 'tiles' && roOf(p).split(' ').length < 2) t = 'hear-mean';
    qs.push({ t, p, pool });
  }
  return shuffle(qs);
}
function practice(u, opts) {
  opts = opts || {};
  if (!opts.qs && u.id && !packLoad[u.id + '_ok']) return ensure([u.id], () => practice(u, opts));
  const pool = opts.pool || u.phrases;
  let qs = opts.qs || buildQs(u.phrases, pool, 12);
  const total = qs.length;
  let done = 0, right = 0, firstTry = 0;
  const missed = new Set();
  const back = opts.back || (() => go(() => unitMenu(u)));
  function nextQ() {
    clearSheets();
    if (!qs.length) return end();
    const q = qs.shift();
    RENDER[q.t](q, ok => {
      grade(q.p.id, ok);
      if (ok) { right++; if (!missed.has(q)) firstTry++; done++; }
      else { missed.add(q); q.miss = (q.miss || 0) + 1; if (q.miss < 3 && !opts.noRequeue) qs.splice(Math.min(qs.length, 3), 0, q); else done++; }
      return ok;
    });
  }
  const RENDER = {
    'hear-mean'(q, res) {
      const opts4 = shuffle([q.p].concat(pick(q.pool.filter(x => x.en !== q.p.en), 3)));
      frame(done / total, `<div class="q">Listen</div><div class="prompt">What does it mean?</div>${playRow(auOf(q.p, Math.random() < .5 ? 'm' : 'f'), null, true)}
        <div class="opts grid2">${opts4.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${i + 1}</span>${esc(o.en)}</button>`).join('')}</div>`, back);
      // the play row above uses one random voice; rebind other-voice-free
      app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        const o = opts4[+b.dataset.i], ok = o === q.p;
        app.querySelectorAll('.opt').forEach(x => x.onclick = null);
        b.classList.add(ok ? 'good' : 'bad');
        if (!ok) app.querySelectorAll('.opt')[opts4.indexOf(q.p)].classList.add('good');
        res(ok);
        sheet(ok ? 'good' : 'bad', ok ? 'Correct!' : 'Not quite', `<span class="th">${esc(thOf(q.p))}</span> · ${esc(roOf(q.p))} = ${esc(q.p.en)}`, 'Continue', nextQ);
        if (!ok) say(auOf(q.p), { slow: true });
      });
    },
    'which-says'(q, res) {
      const opts3 = shuffle([q.p].concat(pick(q.pool.filter(x => x.en !== q.p.en), 2)));
      let sel = -1;
      frame(done / total, `<div class="q">Listen to each</div><div class="prompt">Which one says “${esc(q.p.en)}”?</div>
        <div class="opts">${opts3.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${i + 1}</span><span style="flex:1">Sound ${i + 1}</span><span class="mini">${ic('play')}</span></button>`).join('')}</div>
        <button class="big" id="chk" disabled>Check</button>`, back);
      app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        sel = +b.dataset.i;
        app.querySelectorAll('.opt').forEach(x => x.classList.toggle('sel', x === b));
        say(auOf(opts3[sel]), { btn: b.querySelector('.mini') });
        $('#chk').disabled = false;
      });
      $('#chk').onclick = () => {
        const ok = opts3[sel] === q.p;
        app.querySelectorAll('.opt').forEach((x, i) => { x.onclick = null; x.innerHTML = `<span class="k">${i + 1}</span><span style="flex:1">${S.showTh ? `<span class="th">${esc(thOf(opts3[i]))}</span>` : ''}<small>${esc(roOf(opts3[i]))} · ${esc(opts3[i].en)}</small></span>`; if (opts3[i] === q.p) x.classList.add('good'); else if (i === sel) x.classList.add('bad'); });
        res(ok);
        sheet(ok ? 'good' : 'bad', ok ? 'Correct!' : 'Not quite', ok ? '' : `It was sound ${opts3.indexOf(q.p) + 1}.`, 'Continue', nextQ);
      };
    },
    tiles(q, res) {
      const words = roOf(q.p).replace(/[,.!?]/g, '').split(' ');
      const extra = pick([].concat(...q.pool.filter(x => x !== q.p).map(x => roOf(x).replace(/[,.!?]/g, '').split(' '))).filter(w => !words.includes(w)), Math.min(3, Math.max(2, 6 - words.length)));
      const bag = shuffle(words.concat(extra).map((w, i) => ({ w, i })));
      const chosen = [];
      frame(done / total, `<div class="q">Listen and build</div><div class="prompt">Tap the words you hear, in order</div>${playRow(auOf(q.p), null, true)}
        <div class="slot" id="slot"></div><div class="tiles" id="tiles">${bag.map(b => `<button class="tile" data-i="${b.i}">${esc(b.w)}</button>`).join('')}</div>
        <button class="big" id="chk" disabled>Check</button>`, back);
      const slot = $('#slot'), tiles = $('#tiles');
      const draw = () => { slot.innerHTML = chosen.map((b, k) => `<button class="tile" data-k="${k}">${esc(b.w)}</button>`).join(''); slot.querySelectorAll('.tile').forEach(t => t.onclick = () => { const b = chosen.splice(+t.dataset.k, 1)[0]; tiles.querySelector(`[data-i="${b.i}"]`).classList.remove('used'); draw(); }); $('#chk').disabled = !chosen.length; };
      tiles.querySelectorAll('.tile').forEach(t => t.onclick = () => { if (t.classList.contains('used')) return; t.classList.add('used'); chosen.push(bag.find(b => b.i === +t.dataset.i)); draw(); });
      $('#chk').onclick = () => {
        const ok = chosen.map(b => b.w).join(' ') === words.join(' ');
        res(ok);
        sheet(ok ? 'good' : 'bad', ok ? 'Correct!' : 'Not quite', `<span class="th">${esc(thOf(q.p))}</span><br>${esc(roOf(q.p))} · ${esc(q.p.en)}`, 'Continue', nextQ);
      };
    },
    speak(q, res) {
      let tries = 0;
      frame(done / total, `<div class="q">Speak</div><div class="prompt">Say this in Thai:</div>
        <div class="card"><div class="en" style="font-size:24px;color:var(--tx)">“${esc(q.p.en)}”</div>
        <button class="back" id="hint" style="margin:10px auto 0">${ic('eye')} Show hint</button><div id="hn"></div></div>
        ${micBlock(thOf(q.p), auOf(q.p), r => {
          tries++;
          if (r.ok || tries >= 2) { res(r.ok); sheet(r.ok ? (r.sc >= 0.8 ? 'good' : 'mid') : 'bad', r.ok ? (r.sc >= 0.8 ? 'Great Thai!' : 'Close enough!') : 'Let’s hear it', `<span class="th">${esc(thOf(q.p))}</span> · ${esc(roOf(q.p))}`, 'Continue', nextQ); say(auOf(q.p)); }
        })}
        <button class="big ghost" id="skip">I can’t speak now</button>`, back);
      $('#hint').onclick = () => { $('#hn').innerHTML = `<div style="margin-top:8px">${textBlock(thOf(q.p), roOf(q.p))}</div>`; say(auOf(q.p)); };
      $('#skip').onclick = () => { S.noMicUntil = Date.now() + 36e5; save(); done++; nextQ(); };
    },
    shadow(q, res) {
      let tries = 0;
      frame(done / total, `<div class="q">Listen, then repeat</div><div class="card">${textBlock(thOf(q.p), roOf(q.p))}<div class="en">${esc(q.p.en)}</div></div>
        ${playRow(auOf(q.p), auOf(q.p, other(g())), true)}
        ${micBlock(thOf(q.p), auOf(q.p), r => { tries++; if (r.ok || tries >= 2) { res(r.ok); sheet(r.ok ? 'good' : 'bad', r.ok ? 'Nice!' : 'Keep practising this one', r.ok ? '' : 'It will come back soon.', 'Continue', nextQ); } })}
        <button class="big ghost" id="skip">I can’t speak now</button>`, back);
      $('#skip').onclick = () => { S.noMicUntil = Date.now() + 36e5; save(); done++; nextQ(); };
    },
  };
  // when the learner said "can't speak now", replace speaking items for an hour
  if (S.noMicUntil && Date.now() < S.noMicUntil) qs = qs.map(q => (q.t === 'speak' || q.t === 'shadow') ? Object.assign({}, q, { t: 'hear-mean' }) : q);
  function end() {
    const pct = firstTry / total;
    const stars = pct >= 0.9 ? 3 : pct >= 0.7 ? 2 : 1;
    const xp = 10 + stars * 2;
    addXp(xp);
    if (opts.onEnd) return opts.onEnd(stars, xp, pct);
    mark(u.id, 'practice', stars);
    finish(u, `${Math.round(pct * 100)}% right first time`, xp, stars, () => talk(u));
  }
  nextQ();
}

/* ---------------- TALK (dialogue) ---------------- */
function talk(u) {
  if (!packLoad[u.id + '_ok']) return ensure([u.id], () => talk(u));
  const dl = u.dialogue, me = g();
  let phase = 'listen';
  function render() {
    app.innerHTML = `<button class="back" id="bk">${ic('back')} ${esc(u.title)}</button>
      <div class="q">${phase === 'listen' ? 'Step 1 · Listen to the conversation' : 'Step 2 · Your turn — you are the ' + (me === 'm' ? 'man' : 'woman')}</div>
      <div class="chat" id="chat">${dl.map((l, i) => `<div class="msg ${l.s === me ? 'me' : ''} ${phase === 'role' && l.s === me ? 'hide' : ''}" data-i="${i}">
        <div class="who">${l.s === me ? 'You' : (l.s === 'm' ? 'Man' : 'Woman')}</div>${S.showTh ? `<div class="th">${esc(l.th)}</div>` : ''}${S.showRo ? `<div class="ro">${esc(l.ro)}</div>` : ''}<div class="en">${esc(l.en)}</div></div>`).join('')}</div>
      <div id="ctl"></div><div class="spacer"></div>`;
    $('#bk').onclick = () => go(() => unitMenu(u));
    app.querySelectorAll('.msg').forEach(m => m.onclick = () => phase === 'listen' && say(dl[+m.dataset.i].a));
    if (phase === 'listen') {
      $('#ctl').innerHTML = `<button class="big" id="pa">${ic('play')} Play the whole conversation</button><div style="height:10px"></div><button class="big ghost" id="go">${ic('mic')} I'm ready to speak my part</button><p class="muted center" style="font-size:14px">Tap any bubble to hear just that line.</p>`;
      $('#pa').onclick = () => playAll(0);
      $('#go').onclick = () => { phase = 'role'; render(); roleStep(0); };
    }
  }
  function hl(i) { app.querySelectorAll('.msg').forEach(m => m.classList.toggle('now', +m.dataset.i === i)); const m = app.querySelector(`.msg[data-i="${i}"]`); if (m) m.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  function playAll(i) { if (i >= dl.length) { hl(-1); return; } hl(i); say(dl[i].a, { end: () => playAll(i + 1) }); }
  let good = 0, mine = dl.filter(l => l.s === me).length;
  function roleStep(i) {
    if (i >= dl.length) {
      hl(-1);
      const pct = mine ? good / mine : 1;
      mark(u.id, 'talk'); addXp(10);
      $('#ctl').innerHTML = `<div class="card"><b style="font-size:20px">Conversation done!</b><div class="en">${good} of ${mine} of your lines understood by the checker.</div></div>
        <button class="big" id="fin">Finish</button><div style="height:10px"></div><button class="big ghost" id="again">${ic('redo')} Do it again</button>`;
      $('#fin').onclick = () => finish(u, 'Spoke a whole conversation', 10, pct >= .8 ? 3 : pct >= .5 ? 2 : 1, null);
      $('#again').onclick = () => { good = 0; phase = 'role'; render(); roleStep(0); };
      return;
    }
    const l = dl[i]; hl(i);
    if (l.s !== me) { $('#ctl').innerHTML = `<p class="center muted">Listen…</p>`; say(l.a, { end: () => roleStep(i + 1) }); return; }
    let tries = 0;
    $('#ctl').innerHTML = `<div class="card" style="padding:14px"><div class="muted" style="font-size:14px">Say:</div><div class="en" style="color:var(--tx);font-size:20px">“${esc(l.en)}”</div>
      <button class="back" id="hint" style="margin:6px auto 0">${ic('eye')} Show my line</button></div>
      ${micBlock(l.th, l.a, r => { tries++; if (r.ok || tries >= 2) { if (r.ok) good++; const msg = app.querySelector(`.msg[data-i="${i}"]`); msg.classList.remove('hide'); say(l.a, { end: () => roleStep(i + 1) }); $('#ctl').innerHTML = `<p class="center" style="color:${r.ok ? 'var(--grn)' : 'var(--gold)'}">${r.ok ? 'Good!' : 'Here is how it sounds:'}</p>`; } })}
      <button class="big ghost" id="sk">Skip — play my line</button>`;
    $('#hint').onclick = () => { app.querySelector(`.msg[data-i="${i}"]`).classList.remove('hide'); };
    $('#sk').onclick = () => { app.querySelector(`.msg[data-i="${i}"]`).classList.remove('hide'); say(l.a, { end: () => roleStep(i + 1) }); $('#ctl').innerHTML = ''; };
  }
  render();
}

/* ---------------- finish screen ---------------- */
function finish(u, line, xp, stars, nextFn, sub) {
  clearSheets(); stopAudio();
  app.innerHTML = `<div style="padding-top:8vh" class="center"><div class="done-art">เก่งมาก</div><div class="muted">gèng mâak — excellent!</div>
    ${stars ? `<div class="stars">${[1, 2, 3].map(k => ic('star', k <= stars ? 'on' : '')).join('')}</div>` : '<div style="height:16px"></div>'}
    <h2 style="margin:4px 0">${esc(line)}</h2>${sub ? `<p class="muted">${esc(sub)}</p>` : ''}
    <div class="stat"><div><b>+${xp}</b><small>XP</small></div><div><b>${dayXp()}/${S.goal}</b><small>today</small></div><div><b>${streakNow()}</b><small>day streak</small></div></div>
    ${nextFn ? `<button class="big" id="nx">${ic('next')} Keep going</button><div style="height:10px"></div>` : ''}
    <button class="big ghost" id="hm">Back to ${u && u.title ? esc(u.title) : 'home'}</button></div>`;
  ensure(['core'], () => {}); say(D.cheer);
  if (nextFn) $('#nx').onclick = () => go(nextFn);
  $('#hm').onclick = () => go(() => (u && u.phrases) ? unitMenu(u) : home());
}

/* ---------------- REVIEW ---------------- */
function dueItems() {
  const dn = dayNum();
  return Object.keys(S.items).filter(id => PH[id] && S.items[id].due <= dn);
}
function review() {
  let ids = dueItems();
  const learned = Object.keys(S.items).filter(id => PH[id]);
  if (!learned.length) {
    app.innerHTML = `<button class="back" id="bk">${ic('back')} Home</button><div class="card"><b style="font-size:20px">Nothing to review yet</b><div class="en">Finish the Learn step of a unit first. The phrases you learn come back here at the right time.</div></div>`;
    $('#bk').onclick = () => go(home); return;
  }
  if (ids.length < 8) ids = ids.concat(learned.filter(id => !ids.includes(id)).sort((a, b) => S.items[a].b - S.items[b].b).slice(0, 8 - ids.length));
  const ph = ids.slice(0, 12).map(id => PH[id]);
  const pool = ph.concat(D.units[0].phrases);
  ensure([...new Set(pool.map(p => p.unit))], () => practice({ title: 'Review' }, {
    qs: buildQs(ph, pool, Math.max(8, ph.length)), pool, back: () => go(home),
    onEnd: (stars, xp, pct) => finish({ title: 'home' }, `Review done · ${Math.round(pct * 100)}% first time`, xp, stars, null),
  }));
}

/* ---------------- TONES ---------------- */
function toneMenu() {
  if (!packLoad['core_ok']) return ensure(['core'], toneMenu);
  app.innerHTML = `<button class="back" id="bk">${ic('back')} Home</button>
  <div class="uhead"><div class="th">วรรณยุกต์</div><h2>The 5 tones</h2><p>In Thai the pitch of your voice changes the word. <b>mǎa</b> (rising) is a dog; <b>máa</b> (high) is a horse.</p></div>
  <div class="legend">${Object.keys(TONE).map(t => `<span>${contour(t, '')}${TONE[t].name}</span>`).join('')}</div>
  <button class="mode ${isDone('tones', 'learn') ? 'ok' : ''}" data-m="learn"><div class="n">${isDone('tones', 'learn') ? ic('check') : 1}</div><div><b>Hear the tones</b><small>Tap each word and copy the shape of the voice</small></div></button>
  <button class="mode ${isDone('tones', 'quiz') ? 'ok' : ''}" data-m="quiz"><div class="n">${isDone('tones', 'quiz') ? ic('check') : 2}</div><div><b>Which tone?</b><small>Hear a word, pick its tone</small></div></button>
  <button class="mode ${isDone('tones', 'gym') ? 'ok' : ''}" data-m="gym"><div class="n">${isDone('tones', 'gym') ? ic('check') : 3}</div><div><b>Which word?</b><small>Dog or horse? Rice or white? Pick the meaning you hear</small></div></button>`;
  $('#bk').onclick = () => go(home);
  app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => go(() => ({ learn: toneLearn, quiz: () => toneQuiz('tone'), gym: () => toneQuiz('mean') })[b.dataset.m]()));
}
function toneLearn() {
  let si = 0;
  function show() {
    const set = D.tones[si];
    frame(si / D.tones.length, `<div class="q">Set ${si + 1} of ${D.tones.length}</div><div class="prompt">${esc(set.title)}</div>
      ${set.words.map((w, i) => `<button class="tone" data-i="${i}"><span class="th">${esc(w.th)}</span><div><div class="ro">${esc(w.ro)}</div><small>${esc(w.en)} · ${TONE[w.t].name} tone</small></div>${contour(w.t)}</button>`).join('')}
      <div class="row" style="margin-top:12px"><button class="big ghost" id="all">${ic('play')} Play all</button><button class="big" id="nx">${ic('next')} Next</button></div>
      <p class="muted center" style="font-size:14px">Say each one out loud after the voice. Draw the shape in the air with your hand.</p>`, () => go(toneMenu));
    app.querySelectorAll('.tone').forEach(b => b.onclick = () => say(set.words[+b.dataset.i].a[Math.random() < .5 ? 'm' : 'f'], { btn: b }));
    const btns = app.querySelectorAll('.tone');
    const all = k => { if (k >= set.words.length) return; say(set.words[k].a.f, { btn: btns[k], end: () => all(k + 1) }); };
    $('#all').onclick = () => all(0);
    $('#nx').onclick = () => { si++; if (si < D.tones.length) show(); else { mark('tones', 'learn'); addXp(5); finish(null, 'You heard all 5 tones', 5, null, () => toneQuiz('tone')); } };
    all(0);
  }
  show();
}
function toneQuiz(kind) {
  const all = [].concat(...D.tones.map(s => s.words.map(w => Object.assign({ set: s }, w))));
  const qs = pick(all, 12);
  let i = 0, right = 0;
  function show() {
    const w = qs[i], v = Math.random() < .5 ? 'm' : 'f';
    if (kind === 'tone') {
      frame(i / qs.length, `<div class="q">Listen</div><div class="prompt">Which tone is it?</div>${playRow(w.a[v], null, true)}
        <div class="opts tones">${Object.keys(TONE).map(t => `<button class="opt" data-t="${t}">${contour(t, '')}${TONE[t].name}</button>`).join('')}</div>`, () => go(toneMenu));
      app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(b.dataset.t === w.t, b, `<span class="th">${esc(w.th)}</span> ${esc(w.ro)} (${esc(w.en)}) is <b>${TONE[w.t].name}</b>.`, `.opt[data-t="${w.t}"]`));
    } else {
      const opts = shuffle(w.set.words);
      frame(i / qs.length, `<div class="q">Listen</div><div class="prompt">Which word did you hear?</div>${playRow(w.a[v], null, true)}
        <div class="opts">${opts.map((o, k) => `<button class="opt" data-k="${k}"><span style="flex:1">${esc(o.en)}${S.showRo ? `<small>${esc(o.ro)}</small>` : ''}</span>${contour(o.t, '')}</button>`).join('')}</div>`, () => go(toneMenu));
      app.querySelectorAll('.opt svg').forEach(s => { s.style.width = '52px'; s.style.height = '30px'; });
      app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(opts[+b.dataset.k] === w, b, `<span class="th">${esc(w.th)}</span> ${esc(w.ro)} = ${esc(w.en)}`, `.opt[data-k="${opts.indexOf(w)}"]`));
    }
    function answer(ok, b, txt, goodSel) {
      app.querySelectorAll('.opt').forEach(x => x.onclick = null);
      b.classList.add(ok ? 'good' : 'bad'); if (!ok) { const gEl = app.querySelector(goodSel); if (gEl) gEl.classList.add('good'); }
      if (ok) right++;
      sheet(ok ? 'good' : 'bad', ok ? 'Correct!' : 'Not quite', txt, 'Continue', () => { i++; if (i < qs.length) show(); else end(); });
      if (!ok) say(w.a.f, { slow: true });
    }
  }
  function end() {
    const pct = right / qs.length, stars = pct >= .9 ? 3 : pct >= .7 ? 2 : 1;
    mark('tones', kind === 'tone' ? 'quiz' : 'gym'); addXp(10);
    finish(null, `${right} of ${qs.length} tones right`, 10, stars, kind === 'tone' ? () => toneQuiz('mean') : null);
  }
  show();
}

/* ---------------- READ & WRITE ---------------- */
const CON = {}; D.cons.forEach(c => CON[c.l] = c);
function writeItems(id) {
  if (id.startsWith('c')) { const l = D.consLessons.find(x => x.id === id); return l.letters.map(ch => ({ kind: 'c', big: ch, trace: ch, name: CON[ch].name, ro: CON[ch].ro, en: CON[ch].en, cls: CON[ch].cls, ini: CON[ch].ini, fin: CON[ch].fin, a: CON[ch].a })); }
  if (id === 'v1' || id === 'v2') {
    const set = id === 'v1' ? ['อะ', 'อา', 'อิ', 'อี', 'อึ', 'อือ', 'อุ', 'อู', 'อำ', 'อัว'] : ['เอ', 'แอ', 'โอ', 'ออ', 'ไอ', 'ใอ', 'เอา', 'เอีย', 'เออ'];
    return set.map(f => { const v = D.vowels.find(x => x.f === f); return { kind: 'v', big: v.f, trace: v.f, name: v.ex, ro: v.s, en: `${v.len} vowel · e.g. ${v.ex} ${v.exro} (${v.exen})`, a: v.a }; });
  }
  if (id === 'marks') return D.marks.map(m => ({ kind: 'm', big: 'ก' + m.m, trace: m.ex, name: m.name, ro: m.name, en: `${m.rule} Example: ${m.ex} ${m.exro} (${m.exen})`, a: m.a, ex: m.ex }));
  return [];
}
function writeMenu(id) {
  if (id === 'read') return readQuiz();
  const items = writeItems(id);
  const title = id.startsWith('c') ? D.consLessons.find(x => x.id === id).title : id === 'marks' ? 'Tone marks' : id === 'v1' ? 'Vowels 1' : 'Vowels 2';
  app.innerHTML = `<button class="back" id="bk">${ic('back')} Home</button>
    <div class="uhead"><h2>${esc(title)}</h2><p>${id.startsWith('c') ? 'Each letter has a name: a sound + a word that starts with it, like “A for apple”. Its <b>class</b> (mid / high / low) helps decide the tone.' : id === 'marks' ? 'Tone marks sit above the consonant. What they do depends on the consonant class.' : 'อ is a silent “holder” here so you can see where the vowel goes.'}</p></div>
    <div class="lgrid">${items.map((x, i) => `<button class="lt" data-i="${i}">${esc(x.big)}<i>${esc(x.ro.split(' ')[0])}</i></button>`).join('')}</div>
    <button class="mode ${isDone(id, 'learn') ? 'ok' : ''}" data-m="learn"><div class="n">${isDone(id, 'learn') ? ic('check') : 1}</div><div><b>Learn & trace</b><small>Hear the name, trace it with your finger</small></div></button>
    <button class="mode ${isDone(id, 'quiz') ? 'ok' : ''}" data-m="quiz"><div class="n">${isDone(id, 'quiz') ? ic('check') : 2}</div><div><b>Recognise</b><small>Hear it — find it. See it — say it.</small></div></button>`;
  $('#bk').onclick = () => go(home);
  app.querySelectorAll('.lt').forEach(b => b.onclick = () => say(items[+b.dataset.i].a));
  app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => go(() => b.dataset.m === 'learn' ? writeLearn(id, items) : writeQuiz(id, items)));
}
function writeLearn(id, items) {
  let i = 0;
  function show() {
    const x = items[i];
    frame(i / items.length, `<div class="card" style="padding:16px">
        <div class="thbig th" style="font-size:64px;line-height:1.2">${esc(x.big)}</div>
        <div class="ro">${esc(x.kind === 'c' ? x.ro : x.ro)}</div>
        <div class="en">${x.kind === 'c' ? `<span class="th">${esc(x.name)}</span> — “${esc(x.en)}”` : esc(x.en)}</div>
        ${x.kind === 'c' ? `<div class="facts"><div>Class<b><span class="cls ${x.cls}">${x.cls}</span></b></div><div>Sound<b>${esc(x.ini)}${x.fin && x.fin !== '—' ? ' · end: ' + esc(x.fin) : ''}</b></div></div>` : ''}
      </div>
      ${playRow(x.a, null, true)}
      <div class="q center">Trace it</div>
      <div class="pad" id="pad"></div><div class="padtip">Thai letters usually start at the little circle (the “head”).</div>
      <div class="row"><button class="big ghost" id="clr">${ic('redo')} Clear</button><button class="big" id="nx">${ic('next')} Next</button></div>`, () => go(() => writeMenu(id)));
    const pad = Pad($('#pad'), x.trace);
    $('#clr').onclick = () => pad.clear();
    $('#nx').onclick = () => {
      const sc = pad.score();
      if (sc !== null && sc < 0.45) toast('Try to cover more of the grey letter — or tap Next again to skip.');
      if (sc !== null && sc < 0.45 && !pad.warned) { pad.warned = true; return; }
      i++; if (i < items.length) show(); else { mark(id, 'learn'); addXp(5); finish(null, 'Traced ' + items.length + ' letters', 5, null, () => writeQuiz(id, items)); }
    };
  }
  show();
}
function writeQuiz(id, items) {

  let i = 0, right = 0;

    });

}

/* finger tracing pad with a ghost letter and a coverage score */
function Pad(el, glyph) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const ghost = document.createElement('canvas'), ink = document.createElement('canvas');
  el.append(ghost, ink);
  let W, H, gx, ix, drawn = false;
  function size() {
    W = el.clientWidth * dpr; H = el.clientHeight * dpr;
    [ghost, ink].forEach(c => { c.width = W; c.height = H; });
    gx = ghost.getContext('2d'); ix = ink.getContext('2d');
    const fs = (glyph.length > 1 ? 0.55 : 0.8) * H;
    gx.font = `${fs}px ${getComputedStyle(document.body).getPropertyValue('--th')}`;
    gx.textAlign = 'center'; gx.textBaseline = 'middle';
    gx.fillStyle = '#3d5580'; gx.fillText(glyph, W / 2, H * 0.53);
    ix.lineCap = ix.lineJoin = 'round'; ix.lineWidth = 0.045 * W; ix.strokeStyle = '#3fd6c6';
  }
  size();
  let last = null;
  const pos = e => { const r = ink.getBoundingClientRect(); return [(e.clientX - r.left) * dpr, (e.clientY - r.top) * dpr]; };
  ink.addEventListener('pointerdown', e => { ink.setPointerCapture(e.pointerId); last = pos(e); ix.beginPath(); ix.arc(last[0], last[1], ix.lineWidth / 2, 0, 7); ix.fillStyle = '#3fd6c6'; ix.fill(); drawn = true; e.preventDefault(); });
  ink.addEventListener('pointermove', e => { if (!last) return; const p = pos(e); ix.beginPath(); ix.moveTo(last[0], last[1]); ix.lineTo(p[0], p[1]); ix.stroke(); last = p; e.preventDefault(); });
  const up = () => { last = null; };
  ink.addEventListener('pointerup', up); ink.addEventListener('pointercancel', up);
  return {
    clear() { ix.clearRect(0, 0, W, H); drawn = false; },
    score() {
      if (!drawn) return null;
      const s = 4, gd = gx.getImageData(0, 0, W, H).data, id = ix.getImageData(0, 0, W, H).data;
      let gh = 0, cov = 0, inkN = 0, out = 0;
      const r = Math.round(ix.lineWidth * 0.9);
      for (let y = 0; y < H; y += s) for (let x = 0; x < W; x += s) {
        const k = (y * W + x) * 4, isG = gd[k + 3] > 60, isI = id[k + 3] > 60;
        if (isG) { gh++; if (isI || near(id, x, y, r)) cov++; }
        if (isI) { inkN++; if (!isG && !near(gd, x, y, r)) out++; }
      }
      function near(d, x, y, rr) { for (const [dx, dy] of [[rr, 0], [-rr, 0], [0, rr], [0, -rr]]) { const xx = x + dx, yy = y + dy; if (xx < 0 || yy < 0 || xx >= W || yy >= H) continue; if (d[(yy * W + xx) * 4 + 3] > 60) return true; } return false; }
      return gh ? (cov / gh) * (1 - Math.min(1, out / Math.max(1, inkN))) : 0;
    },
  };
}

/* ---------------- particle-morph hero: dust assembles into Thai words ---------------- */
function Hero(cv, words) {
  if (!cv) return { stop() {} };
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const ctx = cv.getContext('2d');
  let W, H, pts = [], targets = [], wi = 0, raf = 0, t0 = performance.now(), live = true;
  function fit() { W = cv.clientWidth * dpr; H = cv.clientHeight * dpr; cv.width = W; cv.height = H; }
  function sample(word) {
    const o = document.createElement('canvas'); o.width = W; o.height = H; const x = o.getContext('2d');
    let fs = H * 0.62; x.font = `600 ${fs}px ${getComputedStyle(document.body).getPropertyValue('--th')}`;
    const mw = x.measureText(word).width; if (mw > W * 0.86) { fs *= W * 0.86 / mw; x.font = `600 ${fs}px ${getComputedStyle(document.body).getPropertyValue('--th')}`; }
    x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#fff'; x.fillText(word, W / 2, H * 0.44);
    const d = x.getImageData(0, 0, W, H).data, out = [], step = Math.max(3, Math.round(3.2 * dpr));
    for (let y = 0; y < H; y += step) for (let xx = 0; xx < W; xx += step) if (d[(y * W + xx) * 4 + 3] > 128) out.push([xx, y]);
    return shuffle(out);
  }
  function setWord() {
    targets = sample(words[wi % words.length]);
    const N = Math.max(targets.length, 500);
    while (pts.length < N) pts.push({ x: Math.random() * W, y: Math.random() * H, vx: 0, vy: 0, s: Math.random() });
    pts.length = N;
    pts.forEach((p, i) => { const t = targets[i % targets.length]; p.tx = t[0] + (i >= targets.length ? (Math.random() - .5) * W : 0); p.ty = t[1] + (i >= targets.length ? (Math.random() - .5) * H : 0); p.free = i >= targets.length; p.d = Math.random() * 30; });
    t0 = performance.now();
  }
  function frameF(now) {
    if (!live) return;
    const el = (now - t0) / 1000;
    ctx.clearRect(0, 0, W, H);
    for (const p of pts) {
      const k = el * 60 > p.d ? 0.075 : 0.004;
      p.vx = (p.vx + (p.tx - p.x) * k) * 0.78; p.vy = (p.vy + (p.ty - p.y) * k) * 0.78;
      p.x += p.vx + Math.sin(now / 900 + p.s * 9) * 0.15 * dpr; p.y += p.vy + Math.cos(now / 1100 + p.s * 7) * 0.15 * dpr;
      ctx.fillStyle = p.free ? 'rgba(120,150,190,.18)' : (p.s > .85 ? 'rgba(242,184,75,.95)' : 'rgba(63,214,198,.9)');
      ctx.fillRect(p.x, p.y, (p.free ? 1.2 : 1.9) * dpr, (p.free ? 1.2 : 1.9) * dpr);
    }
    if (el > 4.2) {               // scatter, then reform as the next word
      pts.forEach(p => { p.vx += (Math.random() - .5) * 26 * dpr; p.vy += (Math.random() - .5) * 26 * dpr; });
      wi++; setWord();
    }
    raf = requestAnimationFrame(frameF);
  }
  fit(); setWord(); raf = requestAnimationFrame(frameF);
  const onR = () => { fit(); setWord(); };
  window.addEventListener('resize', onR);
  return { stop() { live = false; cancelAnimationFrame(raf); window.removeEventListener('resize', onR); } };
}
